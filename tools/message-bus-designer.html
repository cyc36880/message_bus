<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>消息总线设计器 — message_bus</title>
<!--
  消息总线设计器（message-bus-designer）
  ==========================================================================
  用途：当一个工程里的节点多到「看代码已经理不清谁发谁收」时，用它把
  总线 / 节点 / 发布 / 订阅的关系手工画出来、写清楚、存下来。

  设计原则：
    1. 单文件、零依赖、零构建 —— 双击就能用，也可以直接提交进仓库；
    2. 数据一律 XML，可读可 diff，方便和代码一起进版本控制；
    3. 所有校验规则与 C 实现逐条对齐（见下方 mbTopic* 系列函数，是
       src/mb_topic.c 的忠实移植），保证网页上判「合法」的东西在
       固件里也合法；
    4. 不做代码生成 —— 这个工具只负责把关系讲清楚。

  与 C 实现的语义对照见 tools/README.md。
-->
<style>
:root{
  --bg:#15181d; --bg2:#1b1f26; --bg3:#22272f; --line:#2e343e;
  --fg:#d8dee9; --fg-dim:#8b95a5; --fg-mute:#5d6674;
  --accent:#4c9aff; --accent-dim:#2b5c99;
  --ok:#4ec9a0; --warn:#e3b341; --err:#f26d6d; --info:#7aa2f7;
  --pub:#e3b341; --sub:#4ec9a0; --sys:#c678dd;
  --radius:6px; --mono:"JetBrains Mono","Cascadia Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:13px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
button{
  font:inherit; color:var(--fg); background:var(--bg3); cursor:pointer;
  border:1px solid var(--line); border-radius:var(--radius); padding:4px 10px;
}
button:hover{background:#2a303a; border-color:#3d4653}
button.primary{background:var(--accent-dim); border-color:var(--accent)}
button.primary:hover{background:#336bb3}
button.danger:hover{background:#4a2626; border-color:var(--err); color:var(--err)}
button.tiny{padding:1px 6px; font-size:11px; line-height:1.4}
input,textarea,select{
  font:inherit; color:var(--fg); background:var(--bg); width:100%;
  border:1px solid var(--line); border-radius:var(--radius); padding:3px 6px;
}
input:focus,textarea:focus,select:focus{outline:none; border-color:var(--accent)}
input.bad,textarea.bad{border-color:var(--err); background:#2a1d1d}
input[type=checkbox]{width:auto; accent-color:var(--accent); cursor:pointer}
textarea{resize:vertical; font-family:var(--mono); font-size:12px}
code,.mono{font-family:var(--mono); font-size:12px}

/* ── 顶栏 ───────────────────────────────────────────────────────────── */
.topbar{
  display:flex; align-items:center; gap:14px; padding:8px 14px;
  background:var(--bg2); border-bottom:1px solid var(--line); flex:0 0 auto;
}
.brand{font-weight:600; letter-spacing:.3px; white-space:nowrap}
.brand .ver{color:var(--fg-mute); font-weight:400; font-size:11px; margin-left:4px}
.topbar .spacer{flex:1}
.viewswitch{display:flex; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
.viewswitch button{border:none; border-radius:0; background:transparent; padding:5px 14px}
.viewswitch button.active{background:var(--accent-dim); color:#fff}
.actions{display:flex; gap:6px; flex-wrap:wrap}

/* ── 三栏布局 ───────────────────────────────────────────────────────── */
/* 显式写死行高：只给 grid-template-columns 的话，这一行会「按内容撑」——
   表格内容多就撑到 800px 溢出容器，关系图内容少就缩到 253px，
   于是三栏顶部对齐、底下留一大片空白。minmax(0,1fr) 让行严格等于容器高度，
   再由每个 .pane 自己的 overflow:auto 去滚动。 */
.layout{flex:1; display:grid; grid-template-columns:280px minmax(0,1fr) 340px;
        grid-template-rows:minmax(0,1fr); min-height:0}
.layout.no-inspector{grid-template-columns:280px minmax(0,1fr)}
.layout.no-sidebar{grid-template-columns:minmax(0,1fr) 340px}
.layout.no-sidebar.no-inspector{grid-template-columns:minmax(0,1fr)}
.pane{min-height:0; overflow:auto; background:var(--bg)}
.pane.sidebar{border-right:1px solid var(--line); background:var(--bg2); padding:10px}
.pane.inspector{border-left:1px solid var(--line); background:var(--bg2); padding:10px}
.pane.main{padding:14px}

/* ── 侧栏 ───────────────────────────────────────────────────────────── */
.sec-title{
  font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--fg-mute);
  margin:14px 0 6px; display:flex; align-items:center; gap:6px;
}
.sec-title:first-child{margin-top:0}
.sec-title .line{flex:1; height:1px; background:var(--line)}
.tree-bus{margin-bottom:6px}
.tree-bus > .row{display:flex; align-items:center; gap:6px; padding:3px 4px; border-radius:var(--radius)}
.tree-bus > .row:hover{background:var(--bg3)}
.tree-bus .bname{font-weight:600; flex:1; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tree-node{display:flex; align-items:center; gap:6px; padding:2px 4px 2px 18px; border-radius:var(--radius); cursor:pointer}
.tree-node:hover{background:var(--bg3)}
.tree-node.active{background:var(--accent-dim)}
.tree-node .nname{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tree-node .cnt{color:var(--fg-mute); font-size:11px; font-family:var(--mono)}
.dot{width:7px; height:7px; border-radius:50%; flex:0 0 auto}
.dot.pub{background:var(--pub)} .dot.sub{background:var(--sub)} .dot.both{background:linear-gradient(90deg,var(--pub) 50%,var(--sub) 50%)}
.dot.none{background:var(--fg-mute)}

/* ── 总线区块 / 节点卡片 ────────────────────────────────────────────── */
.bus-block{margin-bottom:22px}
.bus-head{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--bg2); border:1px solid var(--line); border-radius:var(--radius);
  padding:8px 10px; margin-bottom:10px; border-left:3px solid var(--accent);
}
.bus-head .bus-name{width:180px; font-weight:600; font-size:14px}
.bus-head .bus-comment{flex:1; min-width:160px}
.bus-head label{display:flex; align-items:center; gap:5px; color:var(--fg-dim); white-space:nowrap; font-size:12px}
.node-card{
  background:var(--bg2); border:1px solid var(--line); border-radius:var(--radius);
  padding:10px; margin-bottom:10px; scroll-margin-top:10px;
}
.node-card.flash{animation:flash 1.1s ease-out}
@keyframes flash{0%{border-color:var(--accent); box-shadow:0 0 0 3px rgba(76,154,255,.25)} 100%{}}
.node-card > header{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px}
.node-card .node-name{width:170px; font-weight:600}
.node-card .node-comment{flex:1; min-width:140px}
.badges{display:flex; gap:6px; font-size:11px; font-family:var(--mono); white-space:nowrap}
.badge{padding:1px 7px; border-radius:10px; border:1px solid var(--line); color:var(--fg-dim)}
.badge.pub{border-color:#5a4a1f; color:var(--pub)}
.badge.sub{border-color:#1f5344; color:var(--sub)}
.badge.err{border-color:var(--err); color:var(--err)}
.badge.warn{border-color:var(--warn); color:var(--warn)}

table.grid{width:100%; border-collapse:collapse; margin-top:4px}
table.grid th{
  text-align:left; font-weight:500; font-size:11px; color:var(--fg-mute);
  padding:3px 6px; border-bottom:1px solid var(--line); white-space:nowrap;
}
table.grid td{padding:2px 6px; vertical-align:top; border-bottom:1px solid #23282f}
table.grid tr:last-child td{border-bottom:none}
table.grid td.c{text-align:center}
table.grid .cell-narrow{width:60px}
table.grid .cell-act{width:34px; text-align:right}
table.grid th.rowlabel{color:var(--warn)}
.tbl-cap{display:flex; align-items:center; gap:8px; margin-top:10px}
.tbl-cap .t{font-size:11px; letter-spacing:.5px; color:var(--fg-dim)}
.tbl-cap.pub .t{color:var(--pub)} .tbl-cap.sub .t{color:var(--sub)}
.hint{color:var(--fg-mute); font-size:11px; padding:2px 6px 6px}

/* ── C 代码块 ───────────────────────────────────────────────────────── */
.tbl-cap.code .t{color:var(--fg-dim)}
pre.code{
  margin:2px 0 10px; padding:8px 10px; background:#11151a; border:1px solid var(--line);
  border-radius:var(--radius); overflow:auto; max-height:460px;
  font-family:var(--mono); font-size:12px; line-height:1.5; color:#c9d4e0;
}
/* 每行一个块：短行背景也铺满整行，长行则撑到内容宽度（配合 pre 的横向滚动）。
   width:max-content + min-width:100% 正好同时满足这两种情况。 */
pre.code .cl{display:block; width:max-content; min-width:100%; padding:0 2px; border-radius:2px}

/* C 语法着色。颜色是照 #11151a 这个底色挑的，别单独改其中一两个。 */
pre.code .c-kw{color:#c678dd}                     /* keyword */
pre.code .c-ty{color:#4ec9a0}                     /* 类型、mb_xxx_t */
pre.code .c-st{color:#e3b341}                     /* 字符串/字符字面量 */
pre.code .c-nu{color:#d19a66}                     /* 数字 */
pre.code .c-cm{color:#7d8799; font-style:italic}  /* 注释 */
pre.code .c-mc{color:#7aa2f7}                     /* 宏、NULL 这类常量 */
pre.code .c-fn{color:#61afef}                     /* 函数名 */
pre.code .c-pp{color:#c678dd}                     /* 预处理指令 */

/* 新增/改动的代码：只闪背景，不动文字颜色，闪完自动退回透明。
   左侧那条竖杠跟着一起淡出，让「改了哪一行」在一屏代码里一眼能认出来。
   用 inset box-shadow 而不是 border-left —— 不占布局，不会把文字挤动。 */
@keyframes codeflash{
  0%  {background:#3b6fbe; box-shadow:inset 3px 0 0 var(--accent)}
  55% {background:rgba(59,111,190,.45)}
  100%{background:transparent; box-shadow:inset 3px 0 0 transparent}
}
pre.code .cl.flash{animation:codeflash 1.8s ease-out}

/* ── 关系图：左键拖空白处平移整张画布 ───────────────────────────────── */
.graph-scroll{cursor:grab}
.graph-scroll.panning{cursor:grabbing}
.graph-scroll.panning *{cursor:grabbing}

/* ── 关系图 ─────────────────────────────────────────────────────────── */
.graph-bus{
  background:var(--bg2); border:1px solid var(--line); border-radius:var(--radius);
  margin-bottom:18px; overflow:hidden;
}
.graph-bus > header{display:flex; align-items:baseline; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line)}
.graph-bus > header .gname{font-weight:600}
.graph-bus > header .gmeta{color:var(--fg-mute); font-size:11px; font-family:var(--mono)}
.graph-scroll{overflow:auto}
/* SVG 默认是 inline，底下会多出一条基线缝，撑出无谓的滚动条；块级化即可。
   画布高度由脚本按内容 + 可视区算出，所以这里不再限制高度。 */
.graph-scroll svg{display:block}
.graph-empty{padding:20px; color:var(--fg-mute); text-align:center}
.legend{display:flex; gap:16px; padding:8px 12px; border-top:1px solid var(--line); color:var(--fg-dim); font-size:11px; flex-wrap:wrap}
.legend i{display:inline-block; width:22px; height:0; border-top:2px solid; vertical-align:middle; margin-right:5px}
svg text{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.gnode rect{fill:var(--bg3); stroke:var(--line); stroke-width:1.2; cursor:grab}
.gnode:active rect{cursor:grabbing}
.gnode:hover rect{filter:brightness(1.25)}
.gnode.pub rect{stroke:var(--pub)} .gnode.sub rect{stroke:var(--sub)} .gnode.both rect{stroke:var(--accent)}
.gnode text.nm{fill:var(--fg); font-size:12px; font-weight:600; pointer-events:none}
.gnode text.ct{fill:var(--fg-mute); font-size:10px; font-family:var(--mono); pointer-events:none}
/* ── 边：可点、可拖、可改色，带流向动画 ─────────────────────────────── */
/* 可见的线很细，几乎点不中，所以另外画一条透明的粗线专门用来接鼠标。 */
.gedge-hit{fill:none; stroke:transparent; stroke-width:15; cursor:grab; pointer-events:stroke}
.gedge-hit:active{cursor:grabbing}

/* 底线压暗，让上面流动的虚线看得清；颜色由内联 style 覆盖（用户可改）。 */
.gedge{fill:none; stroke-width:1.4; opacity:.38; pointer-events:none}
.gedge.pub{stroke:var(--pub)}
.gedge.orphan{stroke:var(--fg-mute); stroke-dasharray:4 3; opacity:.7}
.gedge.self{stroke:var(--accent)}
.gedge.sel{stroke-width:2.4; opacity:.85}

/* 流向：一条虚线叠在线上。dashoffset 从 16 递减到 0（正好一个周期，
   所以循环无缝），虚线沿路径朝终点跑 —— 也就是从发布者流向订阅者。
   方向搞反的话，动画会在提示「数据倒着流」，所以这里别改成 0 → 16。 */
.gflow{fill:none; stroke-width:2.4; stroke-linecap:round; opacity:.95;
       stroke-dasharray:4 12; pointer-events:none;
       animation:flow 1.5s linear infinite}
.gflow.pub{stroke:var(--pub)}
.gflow.self{stroke:var(--accent)}
@keyframes flow{ from{stroke-dashoffset:16} to{stroke-dashoffset:0} }
@media (prefers-reduced-motion: reduce){
  .gflow{animation:none; stroke-dasharray:none; opacity:.5}
}

/* 标签整组可拖：拖动它就是在改这条边的形状。 */
.glabel-g{cursor:grab}
.glabel-g:active{cursor:grabbing}
.glabel{font-size:10px; font-family:var(--mono); fill:var(--fg-dim); pointer-events:none}
.glabel-bg{fill:var(--bg2); opacity:.94}
.glabel-g:hover .glabel-bg{fill:var(--bg3)}
.glabel-g.sel .glabel-bg{fill:var(--bg3); stroke:var(--accent); stroke-width:1}
.glabel-g.sel .glabel{fill:var(--fg)}
.gpill{fill:var(--bg3); stroke:var(--fg-mute); stroke-dasharray:4 3}
.gpill-text{font-size:10px; font-family:var(--mono); fill:var(--fg-mute)}

/* 选中一条边后浮出来的小面板：改颜色 / 还原 */
.edge-panel{
  position:fixed; z-index:60; display:none; align-items:center; gap:8px;
  background:var(--bg3); border:1px solid var(--line); border-radius:var(--radius);
  padding:7px 9px; box-shadow:0 8px 24px rgba(0,0,0,.5);
  font-size:11px; color:var(--fg);
}
.edge-panel.show{display:flex}
.edge-panel .ep-name{font-family:var(--mono); color:var(--fg-dim); max-width:240px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.edge-panel input[type=color]{width:30px; height:22px; padding:0; border:1px solid var(--line);
  background:var(--bg2); border-radius:4px; cursor:pointer}

/* 图例右边的缩放控件 */
.legend .zoom{margin-left:auto; display:flex; align-items:center; gap:5px}
.legend .zoom b{font-family:var(--mono); min-width:40px; text-align:center; color:var(--fg-dim)}

/* ── 校验面板 ───────────────────────────────────────────────────────── */
.vgroup{margin-bottom:12px}
.vgroup > .head{display:flex; align-items:center; gap:6px; font-size:11px; letter-spacing:.6px; margin-bottom:4px}
.vgroup.err > .head{color:var(--err)} .vgroup.warn > .head{color:var(--warn)} .vgroup.info > .head{color:var(--info)}
.vitem{
  display:flex; gap:7px; padding:5px 7px; border-radius:var(--radius); cursor:pointer;
  border-left:2px solid transparent; margin-bottom:2px; background:var(--bg3);
}
.vitem:hover{border-left-color:var(--accent)}
.vitem .ico{flex:0 0 auto}
.vitem .body{flex:1; min-width:0}
.vitem .where{color:var(--fg-mute); font-size:11px; font-family:var(--mono); margin-top:1px}
.vitem code{background:#12151a; padding:0 3px; border-radius:3px}
.vnone{color:var(--ok); padding:10px; text-align:center; border:1px dashed var(--line); border-radius:var(--radius)}
.count{background:var(--bg3); border-radius:9px; padding:0 7px; font-family:var(--mono); font-size:11px}

/* ── 状态栏 / 提示 ──────────────────────────────────────────────────── */
.statusbar{
  flex:0 0 auto; display:flex; align-items:center; gap:14px; padding:5px 14px;
  background:var(--bg2); border-top:1px solid var(--line);
  color:var(--fg-dim); font-size:12px; font-family:var(--mono);
}
.statusbar .spacer{flex:1}
.statusbar b{color:var(--fg); font-weight:600}
#toast{
  position:fixed; left:50%; bottom:52px; transform:translateX(-50%) translateY(12px);
  background:var(--bg3); border:1px solid var(--accent); border-radius:var(--radius);
  padding:7px 16px; opacity:0; pointer-events:none; transition:.22s; z-index:50;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
#toast.err{border-color:var(--err); color:var(--err)}
.hidden{display:none !important}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">消息总线设计器<span class="ver" id="libver">message_bus</span></div>
  <div class="viewswitch">
    <button id="tab-table" class="active" data-view="table">☰ 表格视图</button>
    <button id="tab-graph" data-view="graph">◈ 关系图视图</button>
  </div>
  <div class="spacer"></div>
  <div class="actions">
    <button id="btn-new">新建</button>
    <button id="btn-sample">载入示例</button>
    <button id="btn-import">导入 XML</button>
    <button id="btn-export">导出 XML</button>
    <button id="btn-save">保存</button>
    <button id="btn-saveas">另存为…</button>
    <button id="btn-sidebar">◧ 侧栏</button>
    <button id="btn-inspector">◨ 校验</button>
  </div>
</header>

<div class="layout" id="layout">
  <!-- 左：文档信息 + 树 -->
  <aside class="pane sidebar" id="sidebar">
    <div class="sec-title">文档<span class="line"></span></div>
    <div style="margin-bottom:6px">
      <input id="doc-title" placeholder="设计名称，例如：温室控制器 v2">
    </div>
    <textarea id="doc-comment" rows="3" placeholder="整体注释：这份设计要解决什么问题、有哪些约定…"></textarea>

    <div class="sec-title">结构<span class="line"></span><span id="tree-count" class="count">0</span></div>
    <div id="tree"></div>
    <button id="btn-add-bus" style="width:100%; margin-top:8px">+ 新建总线</button>

    <div class="sec-title">本地存储<span class="line"></span></div>
    <div style="color:var(--fg-mute); font-size:11px; line-height:1.7">
      编辑内容会自动存进浏览器 localStorage（key: <code>message-bus-designer</code>）。
      「保存」写回上次打开的文件；想落到别的文件用「另存为」。
    </div>
    <button id="btn-clear-local" class="tiny danger" style="margin-top:8px">清除本地自动保存</button>
  </aside>

  <!-- 中：视图 -->
  <main class="pane main" id="main">
    <div id="view-table"></div>
    <div id="view-graph" class="hidden"></div>
  </main>

  <!-- 右：校验 -->
  <aside class="pane inspector" id="inspector">
    <div class="sec-title">一致性校验<span class="line"></span><span id="v-total" class="count">0</span></div>
    <div id="validation"></div>
    <div class="sec-title">术语对照<span class="line"></span></div>
    <div style="color:var(--fg-mute); font-size:11px; line-height:1.8">
      <b style="color:var(--pub)">发布</b> = <code>mb_node_publish()</code><br>
      <b style="color:var(--sub)">订阅</b> = <code>mb_node_subscribe_ex()</code><br>
      <b style="color:var(--sys)">$mb/…</b> = 总线自动发布的节点上线/下线事件<br>
      校验规则移植自 <code>src/mb_topic.c</code>，与固件行为一致。
    </div>
  </aside>
</div>

<footer class="statusbar">
  <span id="stat-counts"></span>
  <span class="spacer"></span>
  <span id="stat-file">尚未保存到文件</span>
  <span class="spacer"></span>
  <span id="stat-state">就绪</span>
</footer>

<input type="file" id="file-input" accept=".xml,application/xml,text/xml" class="hidden">
<div id="toast"></div>

<!-- 选中关系图上的一条线之后浮出来的小面板。位置是 fixed，跟着鼠标走，
     所以放在 body 下而不是塞进 SVG 里 —— 放进 SVG 会跟着缩放和裁剪。 -->
<div class="edge-panel" id="edge-panel">
  <span class="ep-name" id="ep-name"></span>
  <input type="color" id="ep-color" value="#4c9aff" title="线条颜色">
  <button class="tiny" id="ep-reset">还原</button>
  <button class="tiny" id="ep-close">×</button>
</div>

<script>
"use strict";
/* ==========================================================================

/* ===== BEGIN PURE-LOGIC ===== */
/*
 * 下面这一段是纯粹的字符串逻辑，不碰 DOM、不碰 document，因此可以被单独
 * 抽出来跑自检 —— tools/web-selftest.js 会从这两行标记之间取出源码，
 * 用 C 测试（tests/test_topic.c）里的同一张用例表跑一遍。
 *
 * 为了能被 Windows Script Host 这个只认 ES3 的引擎解析，区域内刻意：
 *   - 只用 let / const（会被自检脚本替换成 var），不用模板字符串、
 *     箭头函数、解构、for...of、Map/Set；
 *   - 错误信息用字符串拼接而不是模板字符串。
 *
 * 改这一区时请保持同样的克制，改完记得跑：
 *     cscript //nologo tools\web-selftest.js
 *
 * 注意：两行标记必须各自是**独立且完整**的注释 —— 自检脚本是从
 * BEGIN 那一行的行尾开始截取的，标记和说明若共用一个块注释，说明部分
 * 会因为丢掉开头的斜杠星号而变成语法错误。
 */

const MB_CONFIG_MAX_TOPIC_LEN = 128;   /* 含结尾 '\0'，故有效长度须 < 该值 */
const MB_CONFIG_MAX_NAME_LEN  = 32;
const MB_SEP = "/";
const MB_WILD_ONE = "+";
const MB_WILD_MANY = "#";
const MB_SYS_PREFIX = "$";
const MB_EVENT_PREFIX = "$mb/nodes/";  /* mb_bus.c: build_node_topic() */

function mbTopicIsSystem(topic){
  return typeof topic === "string" && topic.length > 0 && topic.charAt(0) === MB_SYS_PREFIX;
}

/** 对应 mb_topic_validate_topic()：发布主题必须是具体的，不允许通配符。 */
function mbTopicValidateTopic(topic){
  if (!topic) return "主题不能为空";
  if (topic.length >= MB_CONFIG_MAX_TOPIC_LEN)
    return "主题长度须小于 " + MB_CONFIG_MAX_TOPIC_LEN + "（当前 " + topic.length + "）";
  if (topic.indexOf(MB_WILD_ONE) !== -1 || topic.indexOf(MB_WILD_MANY) !== -1)
    return "发布主题中不允许出现通配符 '+' 或 '#'（只有订阅过滤器可以带通配符）";
  return null;
}

/** 对应 mb_topic_validate_filter()：'+' 与 '#' 必须各自独占一层，'#' 还必须在最后一层。 */
function mbTopicValidateFilter(filter){
  if (!filter) return "过滤器不能为空";
  if (filter.length >= MB_CONFIG_MAX_TOPIC_LEN)
    return "过滤器长度须小于 " + MB_CONFIG_MAX_TOPIC_LEN + "（当前 " + filter.length + "）";

  let i = 0;
  while (i < filter.length){
    const start = i;
    while (i < filter.length && filter.charAt(i) !== MB_SEP) i++;
    const level = filter.slice(start, i);

    if (level.indexOf(MB_WILD_MANY) !== -1 && (level !== MB_WILD_MANY || i !== filter.length))
      return "'#' 必须独占一层，且必须是最后一层（例如 a/# 合法，a/#/b、a# 非法）";
    if (level.indexOf(MB_WILD_ONE) !== -1 && level !== MB_WILD_ONE)
      return "'+' 必须独占一层（例如 +/temp 合法，sensor_+/temp 非法）";

    if (i < filter.length && filter.charAt(i) === MB_SEP) i++;
  }
  return null;
}

/** 对应 mb_node.c: validate_node_name()。节点名要能安全地当作主题的一层。 */
function mbValidateNodeName(name){
  if (!name) return "节点名不能为空";
  if (name.length >= MB_CONFIG_MAX_NAME_LEN)
    return "节点名长度须小于 " + MB_CONFIG_MAX_NAME_LEN + "（当前 " + name.length + "）";
  if (name.indexOf(MB_SEP) !== -1) return "节点名不能包含 '/'（会破坏主题层级）";
  if (name.indexOf(MB_WILD_ONE) !== -1 || name.indexOf(MB_WILD_MANY) !== -1)
    return "节点名不能包含通配符 '+' 或 '#'";
  if (name.charAt(0) === MB_SYS_PREFIX) return "节点名不能以 '$' 开头（'$' 是系统主题前缀）";
  return null;
}

/** 对应 mb_topic_match()：MQTT 3.1.1 [MQTT-4.7] 匹配规则。 */
function mbTopicMatch(filter, topic){
  if (!filter || !topic) return false;
  /* [MQTT-4.7.2-1] 首字符为 '$' 的主题不被首层通配符匹配 */
  if (topic.charAt(0) === MB_SYS_PREFIX &&
      (filter.charAt(0) === MB_WILD_ONE || filter.charAt(0) === MB_WILD_MANY))
    return false;

  let f = 0, t = 0;
  for (;;){
    if (filter.charAt(f) === MB_WILD_MANY) return true;  /* 过滤器已校验，'#' 必然是最后一层 */

    let fEnd = filter.indexOf(MB_SEP, f); if (fEnd < 0) fEnd = filter.length;
    let tEnd = topic.indexOf(MB_SEP, t);  if (tEnd < 0) tEnd = topic.length;

    const fLevel = filter.slice(f, fEnd);
    const tLevel = topic.slice(t, tEnd);

    if (fLevel !== MB_WILD_ONE && fLevel !== tLevel) return false;

    const fDone = fEnd === filter.length, tDone = tEnd === topic.length;
    if (fDone && tDone) return true;
    /* 主题已耗尽：仅当过滤器剩余部分恰好是 "/#" 时匹配（"sport/#" 也匹配 "sport"） */
    if (tDone) return fEnd < filter.length && filter.slice(fEnd + 1) === MB_WILD_MANY;
    if (fDone) return false;

    f = fEnd + 1; t = tEnd + 1;
  }
}

/** 对应 mb_dispatch.c: subscription_matches()。判断一条发布能否投递到一条订阅。 */
function mbSubscriptionMatches(sub, topic, source){
  if (!mbTopicMatch(sub.filter, topic)) return false;
  if (sub.source){
    /* 只有带来源的发布才可能命中来源过滤；总线级发布（source = NULL）永远不命中 */
    if (!source || !mbTopicMatch(sub.source, source)) return false;
  }
  if (sub.nolocal && source && source === sub.nodeName) return false;
  return true;
}

/* -------------------------------------------------------------------------
 * 自检用例：与 tests/test_topic.c 中的断言逐条一一对应。
 * 网页里改坏了匹配规则，这一表就会红 —— 固件和网页必须是同一套规则。
 * ---------------------------------------------------------------------- */

/* 主题匹配：[过滤器, 主题, 期望结果] */
const TOPIC_MATCH_CASES = [
  /* topic_exact_match */
  ["a/b/c","a/b/c",true], ["a/b/c","a/b/d",false], ["a","a",true],
  ["a","a/b",false], ["a/b","a",false], ["/a","/a",true],
  ["/a","a",false], ["a//b","a//b",true],
  /* topic_single_wildcard */
  ["a/+/c","a/b/c",true], ["a/+/c","a/b/d",false], ["a/+/c","a/b/x/c",false],
  ["+","a",true], ["+","a/b",false], ["a/+","a",false],
  ["+/+/+","a/b/c",true], ["a/+/c","a//c",true],
  /* topic_multi_wildcard */
  ["#","a",true], ["#","a/b/c",true],
  ["a/#","a",true], ["a/#","a/b",true], ["a/#","a/b/c/d",true], ["a/#","b",false],
  ["a/b/#","a/b",true], ["a/b/#","a/b/c",true], ["a/b/#","a/c",false],
  /* topic_system_prefix */
  ["#","$mb/nodes/ui/connected",false], ["+/nodes","$mb/nodes",false],
  ["$mb/#","$mb/nodes/ui/connected",true],
  ["$mb/nodes/+/connected","$mb/nodes/ui/connected",true],
  ["$mb/nodes/+/connected","$mb/nodes/ui/disconnected",false],
  /* topic_match_null_and_empty */
  [null,"a",false], ["a",null,false], ["","a",false], ["a","",false]
];

const FILTER_OK_CASES  = ["a/b/c", "#", "a/#", "sport/+/player1", "/", "+/+/+"];
const FILTER_BAD_CASES = [null, "", "a/#/b", "a#", "#/a", "a+/b", "a/b+"];

const TOPIC_OK_CASES   = ["motor/cmd", "a", "$mb/nodes/ui/connected"];
const TOPIC_BAD_CASES  = [null, "", "motor/+", "motor/#"];

const NAME_OK_CASES    = ["motor", "sensor_a", "ui", "a"];
const NAME_BAD_CASES   = [null, "", "a/b", "a+b", "a#b", "$mb"];

const LONG_STR = (function(){
  let s = ""; for (let i = 0; i < MB_CONFIG_MAX_TOPIC_LEN + 8; ++i) s += "a"; return s;
})();

/**
 * 跑一遍上面所有用例。
 * @return {string[]} 失败描述；空数组表示全过。故意只返回英文，方便控制台显示。
 */
function runSelfTest(){
  const fails = [];
  let checks = 0;

  function eq(got, want, label){
    checks++;
    if (got !== want) fails.push(label + " -> got " + got + ", want " + want);
  }

  let i;
  for (i = 0; i < TOPIC_MATCH_CASES.length; ++i){
    const c = TOPIC_MATCH_CASES[i];
    eq(mbTopicMatch(c[0], c[1]), c[2], "mbTopicMatch(" + c[0] + ", " + c[1] + ")");
  }
  /* 注意：校验函数返回的是中文错误信息，这里统一折成布尔再比较 ——
     失败信息要能原样打到非 UTF-8 的 Windows 控制台上，不能混进中文。 */
  for (i = 0; i < FILTER_OK_CASES.length; ++i)
    eq(mbTopicValidateFilter(FILTER_OK_CASES[i]) === null, true, "filter should be VALID: " + FILTER_OK_CASES[i]);
  for (i = 0; i < FILTER_BAD_CASES.length; ++i)
    eq(mbTopicValidateFilter(FILTER_BAD_CASES[i]) !== null, true, "filter should be INVALID: " + FILTER_BAD_CASES[i]);
  for (i = 0; i < TOPIC_OK_CASES.length; ++i)
    eq(mbTopicValidateTopic(TOPIC_OK_CASES[i]) === null, true, "topic should be VALID: " + TOPIC_OK_CASES[i]);
  for (i = 0; i < TOPIC_BAD_CASES.length; ++i)
    eq(mbTopicValidateTopic(TOPIC_BAD_CASES[i]) !== null, true, "topic should be INVALID: " + TOPIC_BAD_CASES[i]);
  for (i = 0; i < NAME_OK_CASES.length; ++i)
    eq(mbValidateNodeName(NAME_OK_CASES[i]) === null, true, "node name should be VALID: " + NAME_OK_CASES[i]);
  for (i = 0; i < NAME_BAD_CASES.length; ++i)
    eq(mbValidateNodeName(NAME_BAD_CASES[i]) !== null, true, "node name should be INVALID: " + NAME_BAD_CASES[i]);

  /* topic_too_long */
  eq(mbTopicValidateTopic(LONG_STR) !== null, true, "over-long topic should be INVALID");
  eq(mbTopicValidateFilter(LONG_STR) !== null, true, "over-long filter should be INVALID");

  /* 来源过滤 + NOLOCAL：对应 mb_dispatch.c: subscription_matches() */
  eq(mbSubscriptionMatches({filter:"#", source:"sensor_a", nolocal:false, nodeName:"logger"},
                           "sensor_a/temp", "sensor_a"), true, "source filter should match");
  eq(mbSubscriptionMatches({filter:"#", source:"sensor_a", nolocal:false, nodeName:"logger"},
                           "sensor_b/temp", "sensor_b"), false, "source filter should reject other sources");
  eq(mbSubscriptionMatches({filter:"#", source:"sensor_a", nolocal:false, nodeName:"logger"},
                           "sensor_a/temp", null), false, "bus-level publish (source = NULL) must not match a source filter");
  eq(mbSubscriptionMatches({filter:"#", source:null, nolocal:true, nodeName:"sensor_a"},
                           "sensor_a/temp", "sensor_a"), false, "NOLOCAL should drop self-published messages");
  eq(mbSubscriptionMatches({filter:"#", source:null, nolocal:true, nodeName:"sensor_a"},
                           "sensor_a/temp", "sensor_b"), true, "NOLOCAL should keep other publishers' messages");

  runSelfTest.checks = checks;
  return fails;
}

/* ===== END PURE-LOGIC ===== */

window.mbSelfTest = function(){
  const fails = runSelfTest();
  if (fails.length) console.error("[message-bus-designer self-test] " + fails.length + " FAILURE(S)\n" + fails.join("\n"));
  else console.log("[message-bus-designer self-test] topic rules OK (" + runSelfTest.checks + " checks)");
  return fails;
};

/* ==========================================================================
 * 1. 数据模型
 * ========================================================================== */

const SCHEMA_VERSION = "1.1.0";
const STORAGE_KEY = "message-bus-designer";
const SAMPLE_KEY  = "message-bus-designer:last-sample";

let uidCounter = 0;
const uid = (p) => `${p}-${Date.now().toString(36)}-${(uidCounter++).toString(36)}`;

function newBus(name){
  return { id: uid("bus"), name: name || "", comment: "", nodeEvents: true, nodes: [], edges: [] };
}
function newNode(name){
  return { id: uid("nd"), name: name || "", comment: "", x: null, y: null, publishes: [], subscribes: [] };
}
function newPublish(){ return { id: uid("pb"), topic: "", payload: "", retain: false, to: "", comment: "" }; }
function newSubscribe(){ return { id: uid("sb"), filter: "", source: "", nolocal: false, skipRetained: false, comment: "" }; }

function emptyDoc(){
  return { version: SCHEMA_VERSION, title: "", comment: "", buses: [] };
}

let doc = emptyDoc();

/* 当前视图 / 选中项 / 文件句柄 */
let currentView = "table";
let selectedNodeId = null;
let fileHandle = null;         /* File System Access API 的文件句柄（如果浏览器支持） */
let lastSavedHash = "";

/* ── 查找 ─────────────────────────────────────────────────────────────── */
function findBus(id){ return doc.buses.find(b => b.id === id) || null; }
function findNode(id){
  for (const b of doc.buses){
    const n = b.nodes.find(n => n.id === id);
    if (n) return { bus: b, node: n };
  }
  return null;
}

/* 节点发布到总线上的「最终主题」：定向发布要把目标节点名拼在前面。
   对应 mb_node.c: mb_node_publish_to() 里的 mb_topic_build(dst, subtopic)。 */
function effectiveTopic(pub){ return pub.to ? `${pub.to}${MB_SEP}${pub.topic}` : pub.topic; }

/* ── 边的手工样式 ──────────────────────────────────────────────────────
   节点位置存在 node.x / node.y 上，边的「拖过之后长什么样」同理存在 bus.edges 里。
   键用**节点名 + 主题**而不是内部 id：XML 里认的就是名字，导出再导入还对得上，
   而 id 每次导入都会重新生成。

   dx / dy 是相对自动走线的偏移量（null = 没动过，走自动车道）。
   之所以记偏移而不是记控制点绝对坐标：节点被拖走或重新排版之后，
   手工调过的那条线应该跟着端点一起走，而不是钉死在原来的绝对位置上。 */
function edgeKeyOf(from, to, topic){ return `${from}\u0000${to}\u0000${topic}`; }

function findEdgeStyle(bus, from, to, topic){
  const k = edgeKeyOf(from, to, topic);
  return (bus.edges || []).find(e => edgeKeyOf(e.from, e.to, e.topic) === k) || null;
}

function setEdgeStyle(bus, from, to, topic, patch){
  if (!bus.edges) bus.edges = [];
  let e = findEdgeStyle(bus, from, to, topic);
  if (!e){ e = { from, to, topic, dx: null, dy: null, color: "" }; bus.edges.push(e); }
  Object.assign(e, patch);
  return e;
}

/* 现在还真的存在的那些边，按「起点名 + 终点名 + 主题」列出来。
   直接问 analyze() —— 它是画图和校验共用的同一份结果，另写一套判断
   迟早会跟界面上看到的对不上。

   用途：节点改名（或删掉重发/重订）之后，旧的 <edge> 条目就对不上任何一条线了。
   内存里留着（改回去就又生效），但导出时不再写出去 —— 否则那个名字会一直
   躺在 XML 里，谁也不知道它指的是什么。 */
function liveEdgeKeys(){
  const nameById = new Map();
  for (const b of doc.buses) for (const n of b.nodes) nameById.set(n.id, n.name);
  const set = new Set();
  for (const e of analyze().edges){
    const a = nameById.get(e.pubNodeId), b = nameById.get(e.subNodeId);
    if (a != null && b != null) set.add(edgeKeyOf(a, b, e.topic));
  }
  return set;
}

/* ==========================================================================
 * 2. XML 序列化 / 反序列化
 *    刻意手写序列化而不是用 XMLSerializer —— 输出的缩进和属性省略规则
 *    完全可控，生成的 XML 适合直接提交进版本库、也方便人读和 diff。
 * ========================================================================== */

function xmlEsc(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&apos;")
    .replace(/\r/g, "&#13;").replace(/\n/g, "&#10;").replace(/\t/g, "&#9;");
}
/** 追加一个 <comment> 子元素；内容为空则跳过（保持 XML 干净）。 */
function pushComment(lines, text, pad){
  if (text == null || String(text).trim() === "") return;
  lines.push(`${pad}<comment>${xmlEsc(text)}</comment>`);
}

function docToXml(){
  const L = [];
  L.push('<?xml version="1.0" encoding="UTF-8"?>');
  L.push(`<!-- 由「消息总线设计器」生成；schema 版本 ${SCHEMA_VERSION}，对应 message_bus 1.0.0 -->`);
  L.push(`<message-bus-design version="${xmlEsc(SCHEMA_VERSION)}">`);

  L.push("  <meta>");
  if (doc.title) L.push(`    <title>${xmlEsc(doc.title)}</title>`);
  pushComment(L, doc.comment, "    ");
  L.push("  </meta>");

  for (const bus of doc.buses){
    const busAttrs = [`name="${xmlEsc(bus.name)}"`];
    if (!bus.nodeEvents) busAttrs.push(`node-events="false"`);
    L.push("");
    L.push(`  <bus ${busAttrs.join(" ")}>`);
    pushComment(L, bus.comment, "    ");

    for (const node of bus.nodes){
      /* 位置是关系图里拖出来的，属于呈现信息，有才写 */
      const nAttrs = [`name="${xmlEsc(node.name)}"`];
      if (node.x != null && node.y != null) { nAttrs.push(`x="${Math.round(node.x)}"`, `y="${Math.round(node.y)}"`); }
      L.push(`    <node ${nAttrs.join(" ")}>`);
      pushComment(L, node.comment, "      ");

      for (const p of node.publishes){
        const a = [`topic="${xmlEsc(p.topic)}"`];
        if (p.payload) a.push(`payload="${xmlEsc(p.payload)}"`);
        if (p.retain)  a.push(`retain="true"`);
        if (p.to)      a.push(`to="${xmlEsc(p.to)}"`);
        if (!p.comment || !p.comment.trim()){
          L.push(`      <publish ${a.join(" ")}/>`);
        } else {
          L.push(`      <publish ${a.join(" ")}>`);
          pushComment(L, p.comment, "        ");
          L.push("      </publish>");
        }
      }

      for (const s of node.subscribes){
        const a = [`filter="${xmlEsc(s.filter)}"`];
        if (s.source)       a.push(`source="${xmlEsc(s.source)}"`);
        if (s.nolocal)      a.push(`nolocal="true"`);
        if (s.skipRetained) a.push(`skip-retained="true"`);
        if (!s.comment || !s.comment.trim()){
          L.push(`      <subscribe ${a.join(" ")}/>`);
        } else {
          L.push(`      <subscribe ${a.join(" ")}>`);
          pushComment(L, s.comment, "        ");
          L.push("      </subscribe>");
        }
      }

      L.push("    </node>");
    }

    /* 边的手工样式（拖动过 / 改过颜色的那些）。一个字段都没改过的边不写 ——
       XML 里只留「人真的动过手」的部分，不然每次导出都会多出一堆噪音。
       对不上任何一条现存边的条目也不写（多半是节点改过名）。 */
    const live = (bus.edges || []).length ? liveEdgeKeys() : null;
    for (const e of (bus.edges || [])){
      const hasXY = e.dx != null && e.dy != null;
      if (!hasXY && !e.color) continue;
      if (live && !live.has(edgeKeyOf(e.from, e.to, e.topic))) continue;
      const a = [`from="${xmlEsc(e.from)}"`, `to="${xmlEsc(e.to)}"`, `topic="${xmlEsc(e.topic)}"`];
      if (hasXY)   a.push(`dx="${Math.round(e.dx)}"`, `dy="${Math.round(e.dy)}"`);
      if (e.color) a.push(`color="${xmlEsc(e.color)}"`);
      L.push(`    <edge ${a.join(" ")}/>`);
    }
    L.push("  </bus>");
  }

  L.push("");
  L.push("</message-bus-design>");
  return L.join("\n") + "\n";
}

function xmlToDoc(text){
  const parser = new DOMParser();

  /* 去 BOM 与前导空白。
     FileReader 读带 BOM 的 UTF-8 文件时会原样带出 U+FEFF，而 XML 声明只有在
     文档第 1 列才算合法 —— 不清理的话，用户会看到「XML declaration allowed
     only at the start of the document」这种看不出所以然的报错。
     这里刻意用 charCodeAt 判断而不是正则里的 \uFEFF 字面量：一个肉眼看不见的
     字符留在源码里，迟早会被人当成空白删掉，然后问题以另一种面貌回来。 */
  let raw = String(text == null ? "" : text);
  if (raw.charCodeAt(0) === 0xFEFF) {
    raw = raw.slice(1);
  }
  raw = raw.replace(/^\s+/, "");
  if (!raw) throw new Error("内容是空的");

  const xdoc = parser.parseFromString(raw, "application/xml");

  const perr = xdoc.querySelector("parsererror");
  if (perr){
    /* 浏览器的原始报错很长，掐出「第 N 行第 M 列：原因」这一句就够了。 */
    const msg = perr.textContent.replace(/\s+/g, " ").trim();
    const m = /error on line (\d+) at column (\d+): ([\s\S]*?)(?:Below is a rendering|$)/.exec(msg);
    throw new Error("XML 解析失败：" + (m ? "第 " + m[1] + " 行第 " + m[2] + " 列：" + m[3].trim()
                                         : msg.slice(0, 200)));
  }

  const root = xdoc.documentElement;
  if (!root || root.nodeName !== "message-bus-design")
    throw new Error(`根元素必须是 <message-bus-design>，实际是 <${root ? root.nodeName : "?"}>`);

  const out = emptyDoc();
  out.version = root.getAttribute("version") || SCHEMA_VERSION;

  const meta = childEl(root, "meta");
  if (meta){
    const t = childEl(meta, "title"); if (t) out.title = t.textContent;
    const c = childEl(meta, "comment"); if (c) out.comment = c.textContent;
  }

  for (const busEl of childrenNamed(root, "bus")){
    const bus = newBus(busEl.getAttribute("name") || "");
    bus.nodeEvents = busEl.getAttribute("node-events") !== "false";
    bus.comment = textOf(childEl(busEl, "comment"));

    for (const nodeEl of childrenNamed(busEl, "node")){
      const node = newNode(nodeEl.getAttribute("name") || "");
      node.comment = textOf(childEl(nodeEl, "comment"));
      const x = nodeEl.getAttribute("x"), y = nodeEl.getAttribute("y");
      node.x = x != null && x !== "" && !isNaN(+x) ? +x : null;
      node.y = y != null && y !== "" && !isNaN(+y) ? +y : null;

      for (const pEl of childrenNamed(nodeEl, "publish")){
        const p = newPublish();
        p.topic   = pEl.getAttribute("topic") || "";
        p.payload = pEl.getAttribute("payload") || "";
        p.retain  = pEl.getAttribute("retain") === "true";
        p.to      = pEl.getAttribute("to") || "";
        p.comment = textOf(childEl(pEl, "comment"));
        node.publishes.push(p);
      }
      for (const sEl of childrenNamed(nodeEl, "subscribe")){
        const s = newSubscribe();
        s.filter       = sEl.getAttribute("filter") || "";
        s.source       = sEl.getAttribute("source") || "";
        s.nolocal      = sEl.getAttribute("nolocal") === "true";
        s.skipRetained = sEl.getAttribute("skip-retained") === "true";
        s.comment      = textOf(childEl(sEl, "comment"));
        node.subscribes.push(s);
      }
      bus.nodes.push(node);
    }

    /* 边的手工样式。<edge> 是 <bus> 的直接子元素，和 <node> 平级 ——
       老版本的读取器只认它认识的子元素，看到 <edge> 会直接忽略，所以能安全混用。 */
    for (const eEl of childrenNamed(busEl, "edge")){
      const from = eEl.getAttribute("from") || "", to = eEl.getAttribute("to") || "";
      const topic = eEl.getAttribute("topic") || "";
      if (!from || !to || !topic) continue;      /* 缺字段的条目没有意义，跳过而不是报错 */
      const dx = eEl.getAttribute("dx"), dy = eEl.getAttribute("dy");
      const color = normColor(eEl.getAttribute("color"));
      /* dx / dy 当成一对：只写了一个说明文件被人手改坏了，宁可不认也不猜。 */
      const okXY = dx != null && dy != null && dx !== "" && dy !== "" && !isNaN(+dx) && !isNaN(+dy);
      if (!okXY && !color) continue;
      bus.edges.push({
        from, to, topic,
        dx: okXY ? +dx : null,
        dy: okXY ? +dy : null,
        color
      });
    }
    out.buses.push(bus);
  }
  return out;
}

/* 只认直接子元素 —— querySelector 会连孙子一起选，这里必须精确。 */
function childrenNamed(parent, name){
  const out = [];
  for (const c of parent.children) if (c.nodeName === name) out.push(c);
  return out;
}
function childEl(parent, name){ return childrenNamed(parent, name)[0] || null; }
function textOf(el){ return el ? el.textContent : ""; }

/* ==========================================================================
 * 3. 一致性校验（与 C 实现的口径逐条对齐）
 * ========================================================================== */

/**
 * 返回 { edges, nodeInfo, pubInfo, issues }。
 * edges 是「一条发布真的会投递到一条订阅」的连线，图标视图和校验共用。
 */
function analyze(){
  const issues = [];
  const push = (level, msg, where, busId, nodeId) => issues.push({ level, msg, where, busId, nodeId });

  const edges = [];            /* {pubNodeId, subNodeId, topic, filter, source, sys} */
  const busNames = new Map();  /* 总线名 -> 出现次数 */

  for (const bus of doc.buses){
    const busTag = bus.name || "(未命名总线)";
    const nodeNames = new Map();

    if (!bus.name.trim()) push("error", "总线名称为空 —— <code>mb_bus_create()</code> 会返回 <code>MB_ERR_INVALID_ARG</code>", busTag, bus.id, null);
    busNames.set(bus.name, (busNames.get(bus.name) || 0) + 1);

    for (const node of bus.nodes){
      const where = `${busTag} / ${node.name || "(未命名节点)"}`;
      const nameErr = mbValidateNodeName(node.name);
      if (nameErr) push("error", `节点名非法：${nameErr}`, where, bus.id, node.id);
      else nodeNames.set(node.name, (nodeNames.get(node.name) || 0) + 1);

      /* ── 发布侧校验 ── */
      const seenTopics = new Map();
      for (const p of node.publishes){
        const eff = effectiveTopic(p);
        const pw = `${where} → publish`;

        if (p.to){
          const toErr = mbValidateNodeName(p.to);
          if (toErr) push("error", `定向发布的目标节点名非法：${toErr}`, pw, bus.id, node.id);
          else if (!bus.nodes.some(n => n.name === p.to))
            push("warn", `定向发布目标节点 <code>${esc(p.to)}</code> 在本总线中不存在 —— 对应 <code>mb_node_publish_to()</code> 不要求目标存在，但消息会落空`, pw, bus.id, node.id);
        }

        const tErr = mbTopicValidateTopic(eff);
        if (tErr) push("error", tErr, pw, bus.id, node.id);
        else if (mbTopicIsSystem(eff))
          push("warn", `发布主题 <code>${esc(eff)}</code> 以 '$' 开头：按 MQTT 规则，它<strong>不会</strong>被以 <code>#</code> 或 <code>+</code> 开头的过滤器匹配，订阅者必须显式写出 <code>$…</code>`, pw, bus.id, node.id);

        if (seenTopics.has(eff) && !tErr)
          push("warn", `同一节点重复发布主题 <code>${esc(eff)}</code>（两条发布定义完全等价，留一条即可）`, pw, bus.id, node.id);
        seenTopics.set(eff, true);
      }

      /* ── 订阅侧校验 ── */
      const seenSubs = new Set();
      for (const s of node.subscribes){
        const sw = `${where} → subscribe`;
        const fErr = mbTopicValidateFilter(s.filter);
        if (fErr) push("error", `过滤器非法：${fErr}`, sw, bus.id, node.id);

        if (s.source){
          const sErr = mbTopicValidateFilter(s.source);
          if (sErr) push("error", `来源过滤器非法：${sErr}`, sw, bus.id, node.id);
          else if (!bus.nodes.some(n => n.name === s.source))
            push("info", `来源过滤器 <code>${esc(s.source)}</code> 指向的节点不在本总线内 —— 若它确实来自别处则属正常，否则是拼写错误`, sw, bus.id, node.id);
        }

        if (s.skipRetained && !mbTopicIsSystem(s.filter))
          push("info", `设置了「不接收 retained」，但本设计里没有向匹配该过滤器的主题发过 retained 消息，此项当前无影响`, sw, bus.id, node.id);

        const sig = `${s.filter}\u0000${s.source}\u0000${s.nolocal ? 1 : 0}\u0000${s.skipRetained ? 1 : 0}`;
        if (seenSubs.has(sig)) push("warn", `同一节点存在完全重复的订阅 <code>${esc(s.filter)}</code>（过滤器、来源、标志全同），该节点会收到两次同样的消息`, sw, bus.id, node.id);
        seenSubs.add(sig);

        /* [MQTT-4.7.2-1] 首层通配符收不到系统主题 */
        if ((s.filter[0] === MB_WILD_MANY || s.filter[0] === MB_WILD_ONE) && bus.nodeEvents)
          push("info", `过滤器 <code>${esc(s.filter)}</code> 以首层通配符开头，收不到 <code>$mb/…</code> 节点事件；要收请显式写 <code>$mb/nodes/+/connected</code>`, sw, bus.id, node.id);
      }

      if (node.publishes.length === 0 && node.subscribes.length === 0)
        push("info", "该节点既没有发布也没有订阅（空节点）", where, bus.id, node.id);
    }

    /* 重名检查 */
    for (const [name, n] of nodeNames)
      if (n > 1) push("error", `总线内节点重名：<code>${esc(name)}</code> 出现 ${n} 次 —— <code>mb_node_create()</code> 会返回 <code>MB_ERR_ALREADY_EXISTS</code>`, busTag, bus.id, null);
  }

  /* 总线重名 */
  for (const [name, n] of busNames)
    if (n > 1 && name.trim()) push("error", `总线重名：<code>${esc(name)}</code> 出现 ${n} 次（多条同名总线彼此独立，但容易混淆）`, name, null, null);

  /* ── 计算投递边 ── */
  for (const bus of doc.buses){
    const busTag = bus.name || "(未命名总线)";

    /* 系统事件主题：bus.nodeEvents 打开时，每个节点会自动产生
         $mb/nodes/<name>/connected   (retained, payload = 节点名)
         $mb/nodes/<name>/disconnected (非 retained)
       对应 mb_bus.c: mb_bus_publish_node_event()，source = NULL。 */
    const sysPubs = [];
    if (bus.nodeEvents){
      for (const n of bus.nodes){
        if (!n.name || mbValidateNodeName(n.name)) continue;
        sysPubs.push({ busId: bus.id, nodeId: null, topic: `${MB_EVENT_PREFIX}${n.name}/connected`, system: true });
        sysPubs.push({ busId: bus.id, nodeId: null, topic: `${MB_EVENT_PREFIX}${n.name}/disconnected`, system: true });
      }
    }

    const allPubs = [];
    for (const n of bus.nodes)
      for (const p of n.publishes){
        const eff = effectiveTopic(p);
        if (mbTopicValidateTopic(eff)) continue;   /* 非法的已经在上面报过 */
        allPubs.push({ busId: bus.id, nodeId: n.id, nodeName: n.name, pub: p, topic: eff, system: false });
      }
    for (const sp of sysPubs) allPubs.push({ ...sp, nodeName: null, pub: null });

    const hitCount = new Map();     /* `${nodeId}\u0000${pubId}`  -> 这条发布命中了几条订阅 */
    const subHitCount = new Map();  /* `${nodeId}\u0000${subId}`  -> 这条订阅能收到几条发布 */
    const topicOwners = new Map();  /* topic -> Set(发布它的节点名) */

    for (const pub of allPubs){
      for (const subNode of bus.nodes){
        for (const s of subNode.subscribes){
          if (mbTopicValidateFilter(s.filter)) continue;
          if (s.source && mbTopicValidateFilter(s.source)) continue;

          /* 系统主题的 source 是 NULL：来源过滤永远不命中，NOLOCAL 也管不到 */
          const source = pub.system ? null : pub.nodeName;
          const probe = { filter: s.filter, source: s.source, nolocal: s.nolocal, nodeName: subNode.name };

          if (!mbSubscriptionMatches(probe, pub.topic, source)) continue;

          edges.push({
            busId: bus.id, pubNodeId: pub.nodeId, subNodeId: subNode.id,
            topic: pub.topic, filter: s.filter, source: s.source, system: pub.system,
            retained: pub.pub ? pub.pub.retain : true
          });

          if (!pub.system){
            const k = `${pub.nodeId}\u0000${pub.pub.id}`;
            hitCount.set(k, (hitCount.get(k) || 0) + 1);
          }
          const sk = `${subNode.id}\u0000${s.id}`;
          subHitCount.set(sk, (subHitCount.get(sk) || 0) + 1);
        }
      }
    }

    /* 同一个主题被多个节点发布：订阅者会交替收到两边的内容 */
    for (const pub of allPubs){
      if (pub.system) continue;
      if (!topicOwners.has(pub.topic)) topicOwners.set(pub.topic, new Set());
      topicOwners.get(pub.topic).add(pub.nodeName);
    }
    for (const [topic, owners] of topicOwners){
      if (owners.size < 2) continue;
      push("warn", `主题 <code>${esc(topic)}</code> 被 ${owners.size} 个节点发布（${Array.from(owners).map(esc).join("、")}）—— ` +
                   `订阅者会交替收到两边的内容，界面可能来回跳变；真要这么做，建议约定好各自的子主题`, busTag, bus.id, null);
    }

    /* 一条发布也收不到的订阅：多半是笔误，或者关系还没画完 */
    for (const n of bus.nodes){
      for (const s of n.subscribes){
        if (mbTopicValidateFilter(s.filter)) continue;
        if (s.source && mbTopicValidateFilter(s.source)) continue;
        if (subHitCount.get(`${n.id}\u0000${s.id}`)) continue;
        push("warn", `过滤器 <code>${esc(s.filter)}</code> 匹配不到本总线上的任何发布 —— 要么是拼写错了，` +
                     `要么它在等一个还没画上来的节点（对应 <code>stats.no_subscriber</code> 之外的另一半问题）`,
             `${busTag} / ${n.name} → subscribe`, bus.id, n.id);
      }
    }

    /* 没人订阅的发布 = stats.no_subscriber 的来源 */
    for (const pub of allPubs){
      if (pub.system) continue;
      const k = `${pub.nodeId}\u0000${pub.pub.id}`;
      if (!hitCount.get(k)){
        const node = bus.nodes.find(n => n.id === pub.nodeId);
        push("warn", `主题 <code>${esc(pub.topic)}</code> 没有任何订阅者匹配 —— 发出去只会让 <code>stats.no_subscriber</code> 加一`, `${busTag} / ${node ? node.name : "?"} → publish`, bus.id, pub.nodeId);
      }
    }

    /* 自我投递检查：节点订阅了自己发布的主题且没设 NOLOCAL */
    for (const n of bus.nodes){
      for (const p of n.publishes){
        const eff = effectiveTopic(p);
        if (mbTopicValidateTopic(eff)) continue;
        for (const s of n.subscribes){
          if (mbTopicValidateFilter(s.filter)) continue;
          if (s.nolocal) continue;
          if (!mbTopicMatch(s.filter, eff)) continue;
          push("info", `节点订阅了自己发布的 <code>${esc(eff)}</code> 且未设 NOLOCAL —— 回调会在自己的线程里被再调用一次（改造成「转发器」时通常要加 NOLOCAL）`, `${busTag} / ${n.name}`, bus.id, n.id);
          break;
        }
      }
    }
  }

  return { edges, issues };
}

/* ==========================================================================
 * 4. C 代码生成：把某个节点/总线的实际配置拼成可对照的 C 片段
 *
 *    生成的是**参考片段**，不是让你照单全收：变量名取自节点名、回调是空壳、
 *    payload 只是示例值。目的是让「这份配置落到代码里长什么样」一眼可见。
 *
 *    这里只用 mb_* 公开 API，调用签名与 include/message_bus/*.h 逐字对齐 ——
 *    生成一段编不过的代码，比不生成更糟。
 * ========================================================================== */

/* 纯界面状态，不进 XML：哪些节点/总线正展开着代码。 */
const codeOpen    = new Set();
const busCodeOpen = new Set();
/* key -> 上次生成的文本。留着它是为了 diff 出「这次多了哪几行」，
   好让新增的代码闪一下背景。 */
const codeCache   = new Map();

const C_KEYWORDS = new Set([
  "auto","break","case","char","const","continue","default","do","double","else","enum",
  "extern","float","for","goto","if","inline","int","long","register","restrict","return",
  "short","signed","sizeof","static","struct","switch","typedef","union","unsigned","void",
  "volatile","while","bool","true","false","NULL"]);

/* 节点名 → C 标识符。名字里允许出现 '-'、'.'、中文等，都得换掉；
   整串都换没了（例如全中文节点名）时退回调用方给的 fallback。 */
function cIdent(name, fallback){
  let s = String(name == null ? "" : name).replace(/[^A-Za-z0-9_]/g, "_");
  if (/^[0-9]/.test(s)) s = "n_" + s;
  if (/^_*$/.test(s) || C_KEYWORDS.has(s)) s = "";
  return s || fallback;
}

function cStr(s){
  return '"' + String(s == null ? "" : s)
    .replace(/\\/g, "\\\\").replace(/"/g, '\\"')
    .replace(/\n/g, "\\n").replace(/\r/g, "\\r").replace(/\t/g, "\\t") + '"';
}

/* C 字符串字面量在源码里是 UTF-8 字节，长度不能直接用 JS 的 .length ——
   一个中文字符 JS 算 1、C 里是 3 字节，生成的 payload_len 会错。 */
function utf8Len(s){
  let n = 0;
  for (let i = 0; i < s.length; i++){
    const c = s.charCodeAt(i);
    if (c < 0x80) n += 1;
    else if (c < 0x800) n += 2;
    else if (c >= 0xD800 && c <= 0xDBFF && i + 1 < s.length){ n += 4; i++; }  /* 代理对 */
    else n += 3;
  }
  return n;
}

/* 过滤器 → 回调函数名，带上节点名以保证唯一：
       motor   订阅 motor/cmd        → on_motor_cmd
       lvgl_ui 订阅 sensor/+/value   → on_lvgl_ui_sensor_value

   为什么要带节点名：光用过滤器的话，两个节点订阅同一个主题就会生成两个
   同名函数，拼到一个文件里直接重定义。带上前缀后，每个节点的名字只由它
   自己的配置决定（不依赖别的节点），所以改 A 节点的配置不会波及 B 节点。 */
function handlerName(nodeIdent, filter, used){
  let f = String(filter == null ? "" : filter).replace(/[^A-Za-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
  /* 过滤器首层通常就是节点名自己，去掉免得出现 on_motor_motor_cmd */
  if (f === nodeIdent) f = "";
  else if (f.indexOf(nodeIdent + "_") === 0) f = f.slice(nodeIdent.length + 1);
  if (!f) f = "msg";
  if (/^[0-9]/.test(f)) f = "t_" + f;
  const base = "on_" + nodeIdent + "_" + f;
  let h = base, n = 2;
  while (used.has(h)) h = base + "_" + (n++);
  used.add(h);
  return h;
}

/* 多行注释压成一行，免得把后面那条语句挤到注释里面去 */
function oneLine(s){ return String(s == null ? "" : s).replace(/\s*\n\s*/g, " ").trim(); }

/* ── 总线级别：建总线 + 销毁总线 ───────────────────────────────────── */
function busCodeLines(bus){
  const L = [];
  if (bus.comment) for (const ln of bus.comment.split("\n")) L.push("/* " + ln + " */");
  L.push("mb_bus_t *bus = NULL;");
  if (bus.nodeEvents){
    L.push(`mb_bus_create(${cStr(bus.name)}, &bus);   /* publish_node_events 默认 true */`);
  } else {
    /* 关掉事件就得走 _ex 形式 —— mb_bus_create() 用的是默认配置，改不了 */
    L.push("mb_bus_config_t bus_cfg;");
    L.push("mb_bus_default_config(&bus_cfg);");
    L.push("bus_cfg.publish_node_events = false;");
    L.push(`mb_bus_create_ex(${cStr(bus.name)}, &bus_cfg, &bus);`);
  }
  L.push("");
  L.push("/* 各节点的创建见各自的代码块 */");
  L.push("");
  L.push("mb_bus_destroy(bus);   /* 级联销毁全部节点、订阅与 retained */");
  return L;
}

/* ── 节点级别：建节点 + 发布 + 订阅 + 回调空壳 ─────────────────────── */
function nodeCodeLines(bus, node){
  const L = [];
  /* 名字洗不出标识符时（例如整串中文）退回 node_N。用节点在总线里的序号而不是
     固定 "node"，否则同一条总线上两个中文名节点会生成同名变量。 */
  const v = cIdent(node.name, "node_" + (bus.nodes.indexOf(node) + 1));
  const used = new Set();

  if (node.comment) for (const ln of node.comment.split("\n")) L.push("/* " + ln + " */");
  L.push(`mb_node_t *${v} = NULL;`);
  L.push(`mb_node_create(bus, ${cStr(node.name)}, &${v});`);

  if (node.publishes.length){
    L.push("");
    L.push("/* 发布 */");
    node.publishes.forEach((p, i) => {
      const optsVar = `${v}_pub${i}`;
      let optsArg = "NULL";
      if (p.retain){   /* flags 为 0 时直接传 NULL，省掉一个变量 */
        L.push(`mb_publish_opts_t ${optsVar} = { .flags = MB_PUB_FLAG_RETAIN, .qos = 0 };`);
        optsArg = `&${optsVar}`;
      }
      const payload = (p.payload == null || p.payload === "")
        ? "NULL, 0"
        : `${cStr(p.payload)}, ${utf8Len(p.payload)}`;
      if (p.comment) L.push(`/* ${oneLine(p.comment)} */`);
      if (p.to){
        /* 定向发布：主题栏里存的是子主题，目标节点单独一个参数 */
        const sub = p.topic ? cStr(p.topic) : "NULL";
        L.push(`mb_node_publish_to(${v}, ${cStr(p.to)}, ${sub}, ${payload}, ${optsArg});`);
      } else {
        L.push(`mb_node_publish(${v}, ${cStr(p.topic)}, ${payload}, ${optsArg});`);
      }
    });
  }

  if (node.subscribes.length){
    L.push("");
    L.push("/* 订阅 */");
    const handlers = [];
    node.subscribes.forEach((s, i) => {
      const h = handlerName(v, s.filter, used);
      handlers.push(h);
      if (s.comment) L.push(`/* ${oneLine(s.comment)} */`);
      const needOpts = !!(s.source || s.nolocal || s.skipRetained);
      if (!needOpts){
        L.push(`mb_node_subscribe(${v}, ${cStr(s.filter)}, ${h}, NULL, NULL);`);
      } else {
        /* source_filter / 标志位只有 _ex 形式能表达 */
        const o = `${v}_sub${i}`;
        const flags = [s.nolocal && "MB_SUB_FLAG_NOLOCAL",
                       s.skipRetained && "MB_SUB_FLAG_SKIP_RETAINED"]
                      .filter(Boolean).join(" | ") || "0";
        L.push(`mb_subscribe_opts_t ${o} = {`);
        L.push(`    .filter        = ${cStr(s.filter)},`);
        L.push(`    .source_filter = ${s.source ? cStr(s.source) : "NULL"},`);
        L.push(`    .flags         = ${flags},`);
        L.push(`    .user_data     = NULL,`);
        L.push("};");
        L.push(`mb_node_subscribe_ex(${v}, &${o}, ${h}, NULL);`);
      }
    });

    L.push("");
    L.push("/* 回调：同步跑在发布者的线程里 —— 别做耗时操作，也别直接碰 LVGL 控件 */");
    handlers.forEach((h, i) => {
      if (i) L.push("");
      L.push(`static void ${h}(mb_subscription_t *sub, const mb_message_t *msg, void *user_data)`);
      L.push("{");
      L.push("    (void)sub; (void)user_data;");
      L.push('    printf("%s = %.*s\\n", msg->topic, (int)msg->payload_len, (const char *)msg->payload);');
      L.push("}");
    });
  }

  return L;
}

/* 行级 diff：返回 newLines 里「不在最长公共子序列上」的下标 ——
   也就是新增或被改动的行。朴素 LCS 足够：单个节点撑死几十行。 */
function addedLineIndices(oldLines, newLines){
  const n = oldLines.length, m = newLines.length;
  const dp = [];
  for (let i = 0; i <= n; i++) dp.push(new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--)
    for (let j = m - 1; j >= 0; j--)
      dp[i][j] = oldLines[i] === newLines[j] ? dp[i + 1][j + 1] + 1
                                             : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = [];
  let i = 0, j = 0;
  while (i < n && j < m){
    if (oldLines[i] === newLines[j]){ i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) i++;
    else out.push(j++);
  }
  while (j < m) out.push(j++);
  return out;
}

/* ── C 语法着色 ──────────────────────────────────────────────────────
   逐行扫描，不需要跨行状态机：生成的代码里注释和字符串都收在一行内
   （多行注释在生成时就被拆成了每行一段、各自闭合）。返回 HTML，
   普通文本一律走 esc()。这里只负责上色，不改动任何字符 —— textContent
   必须和输入逐字相等，否则「复制代码」和行级 diff 都会跟着错。 */
const C_TYPES = new Set([
  "void","char","int","short","long","float","double","signed","unsigned",
  "size_t","ssize_t","bool","_Bool","auto","register","static","extern","const",
  "volatile","inline","struct","union","enum","typedef",
  "uint8_t","uint16_t","uint32_t","uint64_t","int8_t","int16_t","int32_t","int64_t"]);

function hlC(line){
  let out = "", i = 0;
  const n = line.length;
  while (i < n){
    const c = line[i];

    /* 注释 —— 先于除法判断，否则 "/" 会被当成普通字符 */
    if (c === "/" && line[i + 1] === "*"){
      const e = line.indexOf("*/", i + 2);
      const stop = e < 0 ? n : e + 2;
      out += `<span class="c-cm">${esc(line.slice(i, stop))}</span>`;
      i = stop; continue;
    }
    if (c === "/" && line[i + 1] === "/"){
      out += `<span class="c-cm">${esc(line.slice(i))}</span>`;
      break;
    }

    /* 字符串 / 字符字面量：\" 和 \\ 不算结束，扫的时候要跳过转义对 */
    if (c === '"' || c === "'"){
      let j = i + 1;
      while (j < n){
        if (line[j] === "\\"){ j += 2; continue; }
        if (line[j] === c){ j++; break; }
        j++;
      }
      out += `<span class="c-st">${esc(line.slice(i, j))}</span>`;
      i = j; continue;
    }

    /* 预处理指令：只认「本行第一个非空白字符是 #」的情况 */
    if (c === "#" && !line.slice(0, i).trim()){
      out += `<span class="c-pp">${esc(line.slice(i))}</span>`;
      break;
    }

    /* 数字：前面不能紧跟标识符字符，免得把 foo2 里的 2 抠出来 */
    if (c >= "0" && c <= "9" && !/[A-Za-z0-9_]/.test(line[i - 1] || "")){
      const m = /^(0[xX][0-9a-fA-F]+|[0-9]+(?:\.[0-9]*)?)([uUlLfF]*)/.exec(line.slice(i));
      out += `<span class="c-nu">${esc(m[0])}</span>`;
      i += m[0].length; continue;
    }

    /* 标识符：类型 → 常量 → 关键字 → 函数名 → 普通名字 */
    if (/[A-Za-z_]/.test(c)){
      const w = /^[A-Za-z_][A-Za-z0-9_]*/.exec(line.slice(i))[0];
      let cls = "";
      if (C_TYPES.has(w) || /_t$/.test(w))              cls = "c-ty";
      else if (/^[A-Z][A-Z0-9_]*$/.test(w))             cls = "c-mc";   /* MB_PUB_FLAG_RETAIN、NULL… */
      else if (C_KEYWORDS.has(w))                       cls = "c-kw";
      else if (/^\s*\(/.test(line.slice(i + w.length))) cls = "c-fn";
      out += cls ? `<span class="${cls}">${esc(w)}</span>` : esc(w);
      i += w.length; continue;
    }

    out += esc(c); i++;
  }
  return out;
}

/* 把代码写进对应的 <pre>。flash 为真时，相对上次新增的行加 .flash 闪一下背景。
   首次生成（缓存里还没有）不闪 —— 否则一展开就是满屏高亮。 */
function renderCodeBlock(key, lines, flash){
  const el = document.querySelector(`[data-code-for="${CSS.escape(key)}"]`);
  if (!el) return;
  const prev  = codeCache.get(key);
  const added = (flash && prev != null)
    ? new Set(addedLineIndices(prev.split("\n"), lines)) : new Set();

  /* 重写 innerHTML 会把 <pre> 自己的滚动位置弹回顶部。改动多行的代码块时，
     你正看着下半截，一改就被拽回开头，闪的那一行刚好在视野外 ——
     看上去就是「改了设置，代码没高亮」。所以先记住、写完再还原。 */
  const st = el.scrollTop, sl = el.scrollLeft;
  el.innerHTML = lines.map((ln, i) =>
    `<span class="cl${added.has(i) ? " flash" : ""}">${hlC(ln)}</span>`).join("\n");
  el.scrollTop = st; el.scrollLeft = sl;
  codeCache.set(key, lines.join("\n"));

  /* 闪的行若在可视区外，只滚这个 <pre>（不动外层页面 —— 否则你正在打字的
     输入框会被滚出屏幕）。
     用 getBoundingClientRect 算相对位置，不能用 offsetTop —— offsetTop 是
     相对最近的有定位祖先算的，不是相对 <pre>，拿它跟 scrollTop 比会把
     本来就在视野里的行误判成「在下面」，于是每改一次就往下滚一截。 */
  if (added.size){
    const first = el.querySelector(".cl.flash");
    if (first && first.offsetHeight){
      const pr = el.getBoundingClientRect(), fr = first.getBoundingClientRect();
      if (fr.top < pr.top)         el.scrollTop += fr.top - pr.top;
      else if (fr.bottom > pr.bottom) el.scrollTop += fr.bottom - pr.bottom;
    }
    /* 万一动画被系统设置（prefers-reduced-motion）或别的样式关掉了，
       animationend 永远不会来，.flash 就会永久留在一行上。兜个底。 */
    clearTimeout(el._flashTimer);
    el._flashTimer = setTimeout(() => {
      for (const s of el.querySelectorAll(".cl.flash")) s.classList.remove("flash");
    }, 2200);
  }
}

/* 闪完就把 .flash 摘掉，让「回归正常」是显式发生的，而不是靠 CSS 动画的
   默认 fill-mode。这样即便以后有人给动画加上 fill-mode: forwards，
   也不会留下一条永远高亮的行。 */
document.addEventListener("animationend", (ev) => {
  const el = ev.target;
  if (el && el.classList && el.classList.contains("flash")) el.classList.remove("flash");
}, true);

/* 重绘所有「已展开」的代码块。结构性改动（增删行列）走 commit() 会整树重建，
   所以由这里补上内容，顺带把新增的行闪一下。 */
function refreshAllCode(flash){
  for (const bus of doc.buses){
    if (busCodeOpen.has(bus.id)) renderCodeBlock(bus.id, busCodeLines(bus), flash);
    for (const node of bus.nodes)
      if (codeOpen.has(node.id)) renderCodeBlock(node.id, nodeCodeLines(bus, node), flash);
  }
}

function refreshDerived(){

  for (const bus of doc.buses){
    for (const node of bus.nodes){

      if (!el) continue;
      const mine = issues.filter(i => i.nodeId === node.id);

      const nWarn = mine.filter(i => i.level === "warn").length;
      el.innerHTML =
        `<span class="badge pub">pub ${node.publishes.length}</span>` +
        `<span class="badge sub">sub ${node.subscribes.length}</span>` +

        (nWarn ? `<span class="badge warn">! ${nWarn}</span>` : "");
    }
  }

  /* 把出错的输入框标红 */
  for (const el of document.querySelectorAll("#view-table input[data-field]")) el.classList.remove("bad");
  markBadFields();

  renderTree();
  renderValidation();
  renderStatus();
}

function markBadFields(){
  const bad = (sel, pred) => {
    for (const el of document.querySelectorAll(`#view-table ${sel}`)){
      if (pred(el)) el.classList.add("bad");
    }
  };
  bad('input[data-field="bus-name"]', el => {
    const b = findBus(el.dataset.bus);
    return !b || !b.name.trim();
  });
  bad('input[data-field="node-name"]', el => mbValidateNodeName(el.value) !== null);
  bad('input[data-field="pub-topic"]',  el => {
    const r = findNode(el.dataset.node);
    const p = r && r.node.publishes[+el.dataset.idx];
    return !p || mbTopicValidateTopic(effectiveTopic(p)) !== null;
  });
  bad('input[data-field="pub-to"]', el => {
    const v = el.value.trim();
    return v !== "" && mbValidateNodeName(v) !== null;
  });
  bad('input[data-field="sub-filter"]', el => mbTopicValidateFilter(el.value) !== null);
  bad('input[data-field="sub-source"]', el => el.value.trim() !== "" && mbTopicValidateFilter(el.value) !== null);
}
