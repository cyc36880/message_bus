const NODE_W = 150, NODE_H = 46, COL_GAP = 210, ROW_GAP = 74, PAD = 36;

function renderGraph(){
  /* 重绘之后面板上记的 key（`总线#序号`）可能已经指向别的东西了，
     所以每次重绘先收起来。真正还需要它的调用方会在重绘后自己再打开。 */
  closeEdgePanel();

  const host = document.getElementById("view-graph");
  if (doc.buses.length === 0){
    host.innerHTML = `<div class="vnone" style="padding:40px">还没有总线，切到表格视图先建一条。</div>`;
    return;
  }
  let html = "";
  for (const bus of doc.buses) html += renderBusGraph(bus);
  html += `<div class="legend">
    <span><i style="border-color:var(--pub)"></i>投递路径（发布者 → 订阅者，虚线朝目标流动）</span>
    <span><i style="border-color:var(--accent)"></i>自我投递</span>
    <span><i style="border-color:var(--fg-mute); border-top-style:dashed"></i>无人订阅</span>
    <span style="color:var(--fg-mute)">单击方框跳到表格视图；拖动方框调整位置；
      <b style="color:var(--fg-dim)">拖动线上的标签可改变线的形状，单击可改颜色</b>；
      Ctrl+滚轮缩放</span>
    <span class="zoom">
      <button class="tiny" data-act="zoom-out" title="缩小">−</button>
      <button class="tiny" data-act="zoom-reset" id="zoom-level" title="恢复 100%">100%</button>
      <button class="tiny" data-act="zoom-in" title="放大">+</button>
    </span>
  </div>`;
  host.innerHTML = html;

  /* 画布至少铺满可视区。自动排版往往只有一两百像素高，下面那片空白既不是
     SVG、也收不到鼠标事件 —— 看上去就是「高度太小」，而且没地方把节点拖开。
     把最后一条总线的画布撑高到填满，这片空白就成了真正能拖的画布。

     算的是画布「应该」有多高，再一次性设成那个值，不加增量 ——
     写增量的话，面板一滚动 rect 就偏移，每次重绘又多加一截，画布会自己长高。

     注意 host（#view-graph）自身是「按内容撑高」的，它的 clientHeight 永远
     等于内容高度，拿它当可视区永远算不出该长高。真正滚动的是外层 .pane，
     所以要量 pane 的可视高度，再从 host 里减掉表头、图例、外边距这些非画布内容。
     视图隐藏时 pane 高度为 0，want 为负，自然跳过。 */
  const busEls = host.querySelectorAll(".graph-bus");
  const last   = busEls.length ? busEls[busEls.length - 1] : null;
  const scroll = last ? last.querySelector(".graph-scroll") : null;
  const svg    = scroll ? scroll.querySelector("svg") : null;
  const pane   = host.closest(".pane") || host;
  if (svg && scroll){
    const w   = parseFloat(svg.getAttribute("width"))  || 0;
    const h   = parseFloat(svg.getAttribute("height")) || 0;
    const cs  = getComputedStyle(pane);
    const visible = pane.clientHeight - (parseFloat(cs.paddingTop) || 0)
                                      - (parseFloat(cs.paddingBottom) || 0);
    const rest    = host.offsetHeight - h;         /* 同一容器内除画布以外的内容 */
    const want    = visible - rest;                /* 铺满可视区所需的画布高度 */
    if (want > 0 && want < 20000){
      if (want > h + 1){
        svg.setAttribute("height", want);
        svg.setAttribute("viewBox", `0 0 ${w} ${want}`);
      }
      /* 关键：把「滚动」这件事锁在 .graph-scroll 这一层。
         .graph-scroll 没有写死高度，高度是按内容（SVG）撑的 —— 于是节点被拖远、
         SVG 长高之后，滚动条跑到外层 .pane 上，而「拖空白平移」平的是
         .graph-scroll，纵向就完全拖不动。给它一个上限，SVG 超出多少就在它内部滚多少。 */
      scroll.style.maxHeight = want + "px";
    }
  }

  /* 缩放要在「撑高画布」之后应用 —— 撑高改的是 width/height 属性，
     而 CSS 尺寸是从这些属性乘出来的，顺序反了就会用旧的逻辑尺寸去算。 */
  applyGraphZoom();
}

function renderBusGraph(bus){
  const busId = bus.id;
  const nodes = bus.nodes.filter(n => n.name && !mbValidateNodeName(n.name));
  if (nodes.length === 0)
    return `<div class="graph-bus"><header><span class="gname">${esc(bus.name || "(未命名总线)")}</span></header>
            <div class="graph-empty">这条总线上还没有合法命名的节点。</div></div>`;

  /* ── 收集「发布集合」 ── */
  const pubList = [];   /* {nodeId, topic, pub|null, system} */
  for (const n of nodes){
    for (const p of n.publishes){
      const eff = effectiveTopic(p);
      if (mbTopicValidateTopic(eff)) continue;
      pubList.push({ nodeId: n.id, topic: eff, pub: p, system: false });
    }
  }
  if (bus.nodeEvents){
    for (const n of nodes){
      pubList.push({ nodeId: n.id, topic: `${MB_EVENT_PREFIX}${n.name}/connected`,    pub: null, system: true, virtual: true });
      pubList.push({ nodeId: n.id, topic: `${MB_EVENT_PREFIX}${n.name}/disconnected`, pub: null, system: true, virtual: true });
    }
  }

  /* ── 计算投递边 ── */
  const edges = [];
  const hit = new Set();
  for (const p of pubList){
    for (const sn of nodes){
      for (const s of sn.subscribes){
        if (mbTopicValidateFilter(s.filter)) continue;
        if (s.source && mbTopicValidateFilter(s.source)) continue;
        const source = p.system ? null : nameOf(bus, p.nodeId);
        const probe = { filter: s.filter, source: s.source, nolocal: s.nolocal, nodeName: sn.name };
        if (!mbSubscriptionMatches(probe, p.topic, source)) continue;
        edges.push({ from: p.nodeId, to: sn.id, topic: p.topic, filter: s.filter, system: p.system });
        if (!p.system) hit.add(`${p.nodeId}\u0000${p.pub.id}`);
      }
    }
  }

  /* ── 分层：从「不接收任何东西的纯发布者」开始，按最长路径往外推 ── */
  const outgoing = new Map(nodes.map(n => [n.id, []]));
  for (const e of edges) if (e.from !== e.to) outgoing.get(e.from).push(e.to);

  const layer = new Map(nodes.map(n => [n.id, 0]));
  for (let iter = 0; iter <= nodes.length; iter++){
    let changed = false;
    for (const e of edges){
      if (e.from === e.to) continue;
      const want = layer.get(e.from) + 1;
      if (want > layer.get(e.to)){ layer.set(e.to, want); changed = true; }
    }
    if (!changed) break;   /* 收敛；有环时会跑满迭代次数后停下（分层图不追求无环） */
  }

  /* ── 分列排版 ── */
  const columns = new Map();
  for (const n of nodes){
    const L = layer.get(n.id);
    if (!columns.has(L)) columns.set(L, []);
    columns.get(L).push(n);
  }
  const maxLayer = Math.max(...columns.keys());
  const pos = new Map();
  let maxRows = 1;
  for (const [L, list] of columns){
    maxRows = Math.max(maxRows, list.length);
    list.forEach((n, i) => pos.set(n.id, { x: PAD + L * COL_GAP, y: PAD + i * ROW_GAP }));
  }
  const orphans = pubList.filter(p => !p.system && !hit.has(`${p.nodeId}\u0000${p.pub.id}`));

  /* 在图上拖过的节点：手工坐标覆盖自动排版 */
  for (const n of nodes) if (n.x != null && n.y != null) pos.set(n.id, { x: n.x, y: n.y });

  /* 画布尺寸：先按自动排版算一遍，再把**手工拖过的节点**也算进来。
     只按自动排版算的话，拖到自动范围之外的节点会落到 viewBox 外面被裁掉 ——
     表现出来就是「画布太小、节点拖不出去、松手后人不见了」。 */
  let width  = PAD * 2 + NODE_W + maxLayer * COL_GAP + (orphans.length ? COL_GAP + 60 : 0);
  let height = PAD * 2 + Math.max(maxRows, orphans.length || 1) * ROW_GAP;
  for (const n of nodes){
    if (n.x == null || n.y == null) continue;
    width  = Math.max(width,  n.x + NODE_W + PAD);
    height = Math.max(height, n.y + NODE_H + PAD);
  }
  /* ── 走线 ──────────────────────────────────────────────────────────────
     同一条线上来回的两个方向（lvgl_ui → motor 和 motor → lvgl_ui）会算出
     完全相同的形状：两条线重叠，两个标签也重叠在同一个交点上，而且怎么拖
     都分不开 —— 因为它们本来就算在同一个位置。所以同一对节点之间的边要分组、
     按序往两侧岔开「车道」，反向的那条自然落到另一侧。

     分组键是**无序**节点对，这一点是关键：用有向对当键的话，
     两条反向边各成一组的第 0 条，又重叠回去了。

     偏移加在**两个控制点**上（而不是只加在垂线上），这样线可以朝任意方向
     拖；标签跟着走 0.75 倍 —— 三次贝塞尔在 t=0.5 处正好是「中点 + 0.75×偏移」。 */
  const LANE_STEP = 26;
  const laneGroups = new Map();
  edges.forEach((e, i) => {
    if (e.from === e.to) return;
    const lo = e.from < e.to ? e.from : e.to;
    const hi = e.from < e.to ? e.to : e.from;
    const k = `${lo}\u0000${hi}`;
    if (!laneGroups.has(k)) laneGroups.set(k, []);
    laneGroups.get(k).push(i);
  });

  graphEdges = new Map();             /* 拖动时要用的几何信息，每次重绘都重建 */
  const draws = [];

  edges.forEach((e, idx) => {
    const A = pos.get(e.from), B = pos.get(e.to);
    if (!A || !B) return;
    const self = e.from === e.to;
    const fromName = nameOf(bus, e.from), toName = nameOf(bus, e.to);
    if (fromName == null || toName == null) return;

    /* ── 端点与默认控制点 ──
       出口按「对方在哪个方向」来选：目标在左边就从左边缘出去。
       写死右边缘出、左边缘入的话，把节点拖到左边之后线会绕一整圈。 */
    let p1, p2, d1, d2, horiz = true;
    if (self){
      p1 = { x: A.x + 26,           y: A.y };
      p2 = { x: A.x + NODE_W - 26,  y: A.y };
      d1 = { x: 0, y: -34 }; d2 = { x: 0, y: -34 };
    } else {
      const acx = A.x + NODE_W / 2, acy = A.y + NODE_H / 2;
      const bcx = B.x + NODE_W / 2, bcy = B.y + NODE_H / 2;
      const ddx = bcx - acx, ddy = bcy - acy;
      if (Math.abs(ddx) >= Math.abs(ddy)){
        const s = ddx >= 0 ? 1 : -1;
        p1 = { x: acx + s * NODE_W / 2, y: acy };
        p2 = { x: bcx - s * NODE_W / 2, y: bcy };
        const pull = Math.max(30, Math.abs(p2.x - p1.x) / 2);
        d1 = { x:  s * pull, y: 0 };
        d2 = { x: -s * pull, y: 0 };
      } else {
        const s = ddy >= 0 ? 1 : -1;
        horiz = false;
        p1 = { x: acx, y: acy + s * NODE_H / 2 };
        p2 = { x: bcx, y: bcy - s * NODE_H / 2 };
        const pull = Math.max(30, Math.abs(p2.y - p1.y) / 2);
        d1 = { x: 0, y:  s * pull };
        d2 = { x: 0, y: -s * pull };
      }
    }

    /* ── 车道偏移（自动）+ 手工偏移（拖出来的）──
       两者要分开留着：拖完之后写回模型的只是**手工**那部分，
       车道偏移是算出来的、下次排版还会重算。 */
    let laneX = 0, laneY = 0;
    if (!self){
      const lo = e.from < e.to ? e.from : e.to;
      const hi = e.from < e.to ? e.to : e.from;
      const lane = (laneGroups.get(`${lo}\u0000${hi}`) || []).indexOf(idx);
      /* 0 → +1、1 → -1、2 → +2、3 → -2…… 同组的两条反向边天然一正一负。 */
      const mag = LANE_STEP * (Math.floor(lane / 2) + 1) * (lane % 2 === 0 ? 1 : -1);
      if (horiz) laneY = mag; else laneX = mag;
    }
    const style = findEdgeStyle(bus, fromName, toName, e.topic);
    const ox = laneX + (style ? (style.dx || 0) : 0);
    const oy = laneY + (style ? (style.dy || 0) : 0);

    const c1x = p1.x + d1.x + ox, c1y = p1.y + d1.y + oy;
    const c2x = p2.x + d2.x + ox, c2y = p2.y + d2.y + oy;
    const d = `M ${p1.x} ${p1.y} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${p2.x} ${p2.y}`;
    /* 贝塞尔在 t=0.5 的取值：中点 + 0.375×(d1+d2) + 0.75×偏移 */
    const lx = (p1.x + p2.x) / 2 + 0.375 * (d1.x + d2.x) + 0.75 * ox;
    const ly = (p1.y + p2.y) / 2 + 0.375 * (d1.y + d2.y) + 0.75 * oy;

    const cls   = self ? "self" : "pub";
    const color = style && style.color ? style.color : "";
    const fill  = color || (self ? "var(--accent)" : "var(--pub)");
    const label = e.system ? e.topic : (e.filter === e.topic ? e.topic : `${e.topic}  ⇒  ${e.filter}`);
    const key   = `${busId}#${idx}`;
    const sel   = selectedEdge && selectedEdge.busId === busId
                  && selectedEdge.key === edgeKeyOf(fromName, toName, e.topic);

    graphEdges.set(key, { busId, from: fromName, to: toName, topic: e.topic,
                          p1, p2, d1, d2, ox, oy, laneX, laneY, self, label });
    /* 箭头 marker 是**每条边一个**，不是按颜色共用。共用的话改一条边的颜色
       就得把同色的其它边的箭头一起改；各自一个才能只动自己那一个。 */
    draws.push({ key, cls, d, lx, ly, label, color, fill, sel,
                 marker: self ? "" : `arw-${busId}-${idx}`,
                 title: `${fromName} → ${toName}\n${label}${color ? "\n颜色 " + color : ""}` });
  });

  const svg = [];
  svg.push(`<svg width="${width}" height="${height}" viewBox="0 0 ${width} ${height}">`);
  svg.push(`<defs>${draws.filter(g => g.marker).map(g =>
    `<marker id="${esc(g.marker)}" viewBox="0 0 10 10" refX="9" refY="5"
             markerWidth="7" markerHeight="7" orient="auto-start-reverse">
       <path d="M0,1 L9,5 L0,9 z" fill="${esc(g.fill)}"/>
     </marker>`).join("")}</defs>`);

  /* ── 边：命中路径 / 底线 / 流向虚线 / 标签 ──
     命中路径是一条透明的粗线 —— 1.4px 的线几乎点不中。
     它排在标签之前，所以标签压在它上面、优先接管鼠标。 */
  for (const g of draws){
    const stroked = g.color ? ` style="stroke:${esc(g.color)}"` : "";
    svg.push(`<path class="gedge-hit" data-edge-key="${esc(g.key)}" d="${g.d}"/>`);
    svg.push(`<path class="gedge ${g.cls}${g.sel ? " sel" : ""}" data-edge-key="${esc(g.key)}"`
           + `${g.marker ? ` data-marker="${esc(g.marker)}"` : ""} d="${g.d}"${stroked}`
           + `${g.marker ? ` marker-end="url(#${esc(g.marker)})"` : ""}><title>${esc(g.title)}</title></path>`);
    svg.push(`<path class="gflow ${g.cls}" data-edge-key="${esc(g.key)}" d="${g.d}"${stroked}/>`);
  }
  for (const g of draws){
    const tw = g.label.length * 5.8 + 8;
    svg.push(`<g class="glabel-g${g.sel ? " sel" : ""}" data-edge-key="${esc(g.key)}"
      transform="translate(${g.lx},${g.ly})">
      <title>拖动可改变这条线的形状；单击可改颜色</title>
      <rect class="glabel-bg" x="${-tw / 2}" y="-10" width="${tw}" height="14" rx="3"/>
      <text class="glabel" x="0" y="0" text-anchor="middle">${esc(g.label)}</text>
    </g>`);
  }

  /* 无人订阅的主题：画成虚线小药丸 */
  orphans.forEach((o, i) => {
    const a = pos.get(o.nodeId);
    if (!a) return;
    const x = PAD + (maxLayer + 1) * COL_GAP, y = PAD + i * ROW_GAP + 12;
    const w = Math.min(190, o.topic.length * 6.2 + 20);
    const y1 = a.y + NODE_H / 2, y2 = y + 10;
    const dx = Math.max(30, (x - (a.x + NODE_W)) / 2);
    svg.push(`<path class="gedge orphan" d="M ${a.x + NODE_W} ${y1} C ${a.x + NODE_W + dx} ${y1}, ${x - dx} ${y2}, ${x} ${y2}"/>`);
    svg.push(`<rect class="gpill" x="${x}" y="${y}" width="${w}" height="20" rx="10"/>`);
    svg.push(`<text class="gpill-text" x="${x + 10}" y="${y + 14}">${esc(o.topic)}</text>`);
  });

  /* 节点方框 */
  for (const n of nodes){
    const p = pos.get(n.id);
    const hasPub = n.publishes.length > 0;
    const hasSub = n.subscribes.length > 0;
    const cls = hasPub && hasSub ? "both" : hasPub ? "pub" : hasSub ? "sub" : "";
    svg.push(`<g class="gnode ${cls}" data-gnode-id="${esc(n.id)}" data-gbus="${esc(busId)}" transform="translate(${p.x},${p.y})">
      <title>${esc(n.name)}${n.comment ? "\n" + esc(n.comment) : ""}\n发布 ${n.publishes.length} · 订阅 ${n.subscribes.length}\n（可拖动调整位置，单击跳到表格视图）</title>
      <rect width="${NODE_W}" height="${NODE_H}" rx="7"/>
      <text class="nm" x="12" y="21">${esc(n.name.length > 18 ? n.name.slice(0, 17) + "…" : n.name)}</text>
      <text class="ct" x="12" y="36">pub ${n.publishes.length} · sub ${n.subscribes.length}</text>
    </g>`);
  }
  svg.push("</svg>");

  const nEdge = edges.filter(e => e.from !== e.to).length;
  return `<div class="graph-bus">
    <header>
      <span class="gname">${esc(bus.name || "(未命名总线)")}</span>
      <span class="gmeta">节点 ${nodes.length} · 发布 ${pubList.filter(p => !p.system).length} · 订阅 ${nodes.reduce((a, n) => a + n.subscribes.length, 0)} · 投递路径 ${nEdge}${orphans.length ? ` · 无人订阅 ${orphans.length}` : ""}${bus.nodeEvents ? " · 含 $mb 事件" : ""}</span>
      <span style="flex:1"></span>
      <button class="tiny" data-act="reset-layout" data-bus="${esc(busId)}">重新自动排版</button>
    </header>
    <div class="graph-scroll">${svg.join("")}</div>
  </div>`;
}

function nameOf(bus, nodeId){ const n = bus.nodes.find(x => x.id === nodeId); return n ? n.name : null; }

/* ── 拖动节点：位置写回 XML 的 x / y ──────────────────────────────────
   拖完整体重绘一次，因为连线是按坐标算好的，光改 transform 会让边留在原地。 */
let dragState = null;
/* 空白处左键拖拽 = 平移画布。实现的其实就是滚动那个容器。 */
let panState = null;
/* 拖线条 / 拖标签 = 给这条边攒一个手工偏移。 */
let edgeState = null;

/* key(`${busId}#${idx}`) -> 该边的几何信息；每次重绘重建。
   拖动期间不动模型，松手才写回去 —— 所以这块信息得活到 mouseup。 */
let graphEdges = new Map();
/* 选中的边。存「名字 + 主题」算出的键（就是 XML 里认的那个），
   重绘之后 idx 会变，但这个名字组合不会。 */
let selectedEdge = null;          /* { busId, key } */

/* 缩放是纯视野状态，不进 XML、也不进 localStorage：
   它描述的是「你现在想看多大」，不是这份设计的一部分。 */
let graphZoom = 1;
const ZOOM_MIN = 0.35, ZOOM_MAX = 3;

/* 颜色一律归一成 #rrggbb。XML 是手写友好的，从文件里读进来的 color 属性
   可能是任何东西；直接塞进 SVG 属性/样式迟早出事。 */
function normColor(s){
  const t = String(s == null ? "" : s).trim();
  if (/^#[0-9a-fA-F]{6}$/.test(t)) return t.toLowerCase();
  if (/^#[0-9a-fA-F]{3}$/.test(t)) return ("#" + t[1] + t[1] + t[2] + t[2] + t[3] + t[3]).toLowerCase();
  return "";
}

/* 把逻辑尺寸（width / height 属性）乘上缩放，落到 CSS 尺寸上。
   viewBox 保持逻辑尺寸不变，所以缩放是浏览器替我们做的 ——
   不用自己乘坐标，也就不会漏掉哪一处。 */
function applyGraphZoom(){
  for (const svg of document.querySelectorAll(".graph-scroll > svg")){
    const w = parseFloat(svg.getAttribute("width"))  || 0;
    const h = parseFloat(svg.getAttribute("height")) || 0;
    if (!w || !h) continue;
    svg.style.width  = (w * graphZoom) + "px";
    svg.style.height = (h * graphZoom) + "px";
  }
  const lvl = document.getElementById("zoom-level");
  if (lvl) lvl.textContent = Math.round(graphZoom * 100) + "%";
}

function setGraphZoom(z){ graphZoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z)); applyGraphZoom(); }

/* 屏幕坐标 → SVG 用户坐标。
   getBoundingClientRect() 给的是缩放**之后**的 CSS 盒子，viewBox 是缩放前的
   逻辑尺寸，两者之比才是真正的换算系数。少了这一步，缩放到 50% 之后
   拖节点会严重偏移（鼠标动 100px，节点动 200px）。 */
function svgPoint(svg, ev){
  const r  = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const w  = (vb && vb.width)  || parseFloat(svg.getAttribute("width"))  || r.width;
  const h  = (vb && vb.height) || parseFloat(svg.getAttribute("height")) || r.height;
  return { x: (ev.clientX - r.left) * (w / (r.width  || 1)),
           y: (ev.clientY - r.top)  * (h / (r.height || 1)) };
}

/* 拖动时直接改 DOM，不整块重绘 —— 重绘会丢掉「正在拖的那条边」这个状态，
   而且每帧重建整个 SVG 会卡。松手才写回模型。 */
function paintEdge(key, g, ox, oy){
  const c1x = g.p1.x + g.d1.x + ox, c1y = g.p1.y + g.d1.y + oy;
  const c2x = g.p2.x + g.d2.x + ox, c2y = g.p2.y + g.d2.y + oy;
  const d  = `M ${g.p1.x} ${g.p1.y} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${g.p2.x} ${g.p2.y}`;
  const lx = (g.p1.x + g.p2.x) / 2 + 0.375 * (g.d1.x + g.d2.x) + 0.75 * ox;
  const ly = (g.p1.y + g.p2.y) / 2 + 0.375 * (g.d1.y + g.d2.y) + 0.75 * oy;
  for (const el of document.querySelectorAll(`[data-edge-key="${key}"]`)){
    if (el.tagName === "path") el.setAttribute("d", d);
    else el.setAttribute("transform", `translate(${lx},${ly})`);
  }
}

/* ── 改颜色的小面板 ── */
function closeEdgePanel(){
  const p = document.getElementById("edge-panel");
  if (p) p.classList.remove("show");
}

function openEdgePanel(busId, key, atX, atY){
  const info = graphEdges.get(key);
  const bus  = findBus(busId);
  if (!info || !bus) return;
  const p = document.getElementById("edge-panel");
  const name = document.getElementById("ep-name");
  const color = document.getElementById("ep-color");
  if (!p || !name || !color) return;

  const cur = findEdgeStyle(bus, info.from, info.to, info.topic);
  name.textContent = `${info.from} → ${info.to}`;
  /* 没设过颜色时，把当前实际生效的默认色填进色板，免得打开一看是黑的
     —— 用户会以为「这条线本来就是黑的」，然后一改就把默认色固化下来。
     默认色从 CSS 变量里读，而不是查元素的计算样式：视图隐藏时
     getComputedStyle 给不出真值。 */
  const defVar = info.self ? "--accent" : "--pub";
  const defCol = (getComputedStyle(document.documentElement)
                    .getPropertyValue(defVar) || "").trim();
  color.value = (cur && cur.color) ? cur.color : (normColor(defCol) || "#4c9aff");
  p.dataset.bus   = busId;
  p.dataset.key   = key;
  p.classList.add("show");

  /* 先显示再量尺寸，否则 offsetWidth 是 0，算不出该怎么躲开屏幕边缘。 */
  const w = p.offsetWidth, h = p.offsetHeight;
  p.style.left = Math.max(6, Math.min(window.innerWidth  - w - 6, atX + 10)) + "px";
  p.style.top  = Math.max(6, Math.min(window.innerHeight - h - 6, atY + 12)) + "px";
}

document.addEventListener("mousedown", (ev) => {
  if (ev.button !== 0) return;

  /* 面板和里面的控件自己处理点击。 */
  if (ev.target.closest("#edge-panel")) return;

  const g   = ev.target.closest(".gnode[data-gnode-id]");
  const eEl = ev.target.closest("[data-edge-key]");

  /* 命中优先级：节点 > 线/标签 > 空白。
     线在节点下面画，所以节点必须优先 —— 不然边一穿过方框，
     方框就再也拖不动了。 */
  if (!g && eEl){
    const key = eEl.dataset.edgeKey;
    const info = graphEdges.get(key);
    if (info){
      edgeState = {
        key, info, moved: false,
        startX: ev.clientX, startY: ev.clientY,
        svg: eEl.ownerSVGElement,          /* 拖出 SVG 之外时 target 会变，先记住 */
        pt: svgPoint(eEl.ownerSVGElement, ev),
        ox: info.ox, oy: info.oy
      };
      closeEdgePanel();
      document.body.style.userSelect = "none";
      ev.preventDefault();
      return;
    }
  }

  /* 没点在方框上：如果点在关系图的空白处，就平移整张画布。
     命中方框优先——不然节点一旦压住空白就再也拖不动了。 */
  if (!g){
    const scroller = ev.target.closest(".graph-scroll");
    if (!scroller) return;
    /* 点空白 = 取消选中。 */
    if (selectedEdge){ selectedEdge = null; closeEdgePanel(); renderGraph(); }
    panState = {
      scroller, startX: ev.clientX, startY: ev.clientY,
      sl: scroller.scrollLeft, st: scroller.scrollTop
    };
    scroller.classList.add("panning");
    document.body.style.userSelect = "none";
    ev.preventDefault();
    return;
  }

  const m = /translate\(\s*(-?[\d.]+)\s*,\s*(-?[\d.]+)\s*\)/.exec(g.getAttribute("transform") || "");
  if (!m) return;
  const pt = svgPoint(g.ownerSVGElement, ev);
  dragState = {
    g, nodeId: g.dataset.gnodeId, moved: false, last: null,
    offX: pt.x - parseFloat(m[1]), offY: pt.y - parseFloat(m[2]),
    startX: ev.clientX, startY: ev.clientY
  };
  ev.preventDefault();
});

/* Ctrl + 滚轮缩放，以光标为锚点：放大之后指针底下还是原来那个东西。
   passive:false 是必需的 —— 不然 preventDefault() 不生效，
   浏览器会同时把页面缩放掉。 */
document.addEventListener("wheel", (ev) => {
  if (!ev.ctrlKey) return;
  const scroller = ev.target.closest && ev.target.closest(".graph-scroll");
  const svg = scroller && scroller.querySelector("svg");
  if (!svg) return;
  ev.preventDefault();

  const before = svg.getBoundingClientRect();
  const vb   = svg.viewBox.baseVal;
  const old  = graphZoom;
  const k    = Math.exp(-ev.deltaY * 0.0015);    /* 往上滚 = 放大 */
  const next = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, old * k));
  if (next === old) return;

  /* 光标处的「逻辑坐标」缩放前后必须停在原地。
     它在内容里的位置是 cx（逻辑坐标），对应的像素位置是 px；
     缩放后 cx 会跑到 cx*(next/old) 处，把滚动条补上这个差值即可。 */
  const px = ev.clientX - before.left, py = ev.clientY - before.top;
  const cx = px * (vb.width  / (before.width  || 1));
  const cy = py * (vb.height / (before.height || 1));

  setGraphZoom(next);                            /* next 可能被夹住，所以用实际值算 */

  const grow = next / old;
  scroller.scrollLeft += cx * grow - px;
  scroller.scrollTop  += cy * grow - py;
}, { passive: false });

document.addEventListener("mousemove", (ev) => {
  if (edgeState){
    if (!edgeState.moved &&
        Math.abs(ev.clientX - edgeState.startX) + Math.abs(ev.clientY - edgeState.startY) > 3)
      edgeState.moved = true;
    if (!edgeState.moved) return;
    const pt = svgPoint(edgeState.svg, ev);
    /* 标签走 0.75 倍（贝塞尔 t=0.5 的系数），所以反推偏移要除以它。 */
    const ox = edgeState.ox + (pt.x - edgeState.pt.x) / 0.75;
    const oy = edgeState.oy + (pt.y - edgeState.pt.y) / 0.75;
    paintEdge(edgeState.key, edgeState.info, ox, oy);
    edgeState.last = { ox, oy };
    return;
  }

  if (panState){
    /* 往哪边拖，内容就往哪边走：所以是「减去」位移。 */
    panState.scroller.scrollLeft = panState.sl - (ev.clientX - panState.startX);
    panState.scroller.scrollTop  = panState.st - (ev.clientY - panState.startY);
    return;
  }

  if (!dragState) return;
  if (!dragState.moved &&
      Math.abs(ev.clientX - dragState.startX) + Math.abs(ev.clientY - dragState.startY) > 3)
    dragState.moved = true;
  if (!dragState.moved) return;

  const pt = svgPoint(dragState.g.ownerSVGElement, ev);
  const x = Math.max(0, pt.x - dragState.offX);
  const y = Math.max(0, pt.y - dragState.offY);
  dragState.g.setAttribute("transform", `translate(${x},${y})`);
  dragState.last = { x, y };

  /* 拖着拖着把画布撑大。只改 transform 不改 viewBox 的话，指针一越过边界
     节点就被裁掉，用户根本没法把图摊开 —— 这正是「拖不出去」的来源。
     撑大只动 viewBox 和尺寸属性，不动里面任何元素，所以坐标不需要重算。

     尺寸属性改完之后要重算一次 CSS 尺寸：缩放就是靠 style.width/height
     撑出来的，属性变了样式不跟着变，SVG 会被压回旧的那一格。 */
  const svg = dragState.g.ownerSVGElement;
  const curW = parseFloat(svg.getAttribute("width"))  || 0;
  const curH = parseFloat(svg.getAttribute("height")) || 0;
  const needW = x + NODE_W + PAD;
  const needH = y + NODE_H + PAD;
  if (needW > curW || needH > curH){
    const w = Math.max(curW, needW), h = Math.max(curH, needH);
    svg.setAttribute("width", w);
    svg.setAttribute("height", h);
    svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
    applyGraphZoom();
  }

  document.body.style.userSelect = "none";
});

document.addEventListener("mouseup", () => {
  if (edgeState){
    document.body.style.userSelect = "";
    const st = edgeState;
    edgeState = null;
    const info = st.info;
    if (st.moved && st.last){
      /* 手工偏移是**叠加**在自动车道上的，所以写回去的是总量减车道量。
         不减去的话，同组里另外那条边一动，这条会跟着跳一下。 */
      const bus = findBus(info.busId);
      if (bus){
        setEdgeStyle(bus, info.from, info.to, info.topic, {
          dx: Math.round(st.last.ox - info.laneX),
          dy: Math.round(st.last.oy - info.laneY)
        });
        schedulePersist();
      }
    } else {
      /* 没移动 = 单击：选中它并弹出改颜色的小面板。 */
      const info2 = graphEdges.get(st.key);
      if (info2){
        selectedEdge = { busId: info2.busId, key: edgeKeyOf(info2.from, info2.to, info2.topic) };
        renderGraph();
        openEdgePanel(info2.busId, st.key, st.startX, st.startY);
      }
    }
    return;
  }

  if (panState){
    panState.scroller.classList.remove("panning");
    document.body.style.userSelect = "";
    panState = null;
    return;
  }

  if (!dragState) return;
  document.body.style.userSelect = "";
  const st = dragState;
  dragState = null;

  if (st.moved && st.last){
    const r = findNode(st.nodeId);
    if (r){ r.node.x = Math.round(st.last.x); r.node.y = Math.round(st.last.y); }
    renderGraph();          /* 重算连线端点 */
    schedulePersist();
  } else {
    gotoNode(st.nodeId);    /* 没移动 = 单击，跳到表格视图的对应节点 */
  }
});

/* ==========================================================================
 * 7. 渲染：侧栏树 / 校验面板 / 状态栏
 * ========================================================================== */

function renderTree(){
  const host = document.getElementById("tree");
  let n = 0;
  for (const b of doc.buses) n += b.nodes.length;
  document.getElementById("tree-count").textContent = String(n);

  if (doc.buses.length === 0){ host.innerHTML = `<div class="hint">（空）</div>`; return; }

  host.innerHTML = doc.buses.map(bus => {
    const bcls = !bus.name.trim() ? "bad" : "";
    const nodes = bus.nodes.map(node => {
      const hasPub = node.publishes.length > 0, hasSub = node.subscribes.length > 0;
      const cls = hasPub && hasSub ? "both" : hasPub ? "pub" : hasSub ? "sub" : "none";
      const act = node.id === selectedNodeId ? " active" : "";
      return `<div class="tree-node${act}" data-goto-node="${esc(node.id)}">
        <span class="dot ${cls}"></span>
        <span class="nname">${esc(node.name || "(未命名)")}</span>
        <span class="cnt">${node.publishes.length}/${node.subscribes.length}</span>
      </div>`;
    }).join("") || `<div class="hint" style="padding-left:18px">（无节点）</div>`;
    return `<div class="tree-bus">
      <div class="row"><span class="dot" style="background:var(--accent)"></span>
        <span class="bname ${bcls}" data-goto-bus="${esc(bus.id)}">${esc(bus.name || "(未命名总线)")}</span>
        <button class="tiny" data-act="add-node" data-bus="${esc(bus.id)}">+</button>
      </div>${nodes}</div>`;
  }).join("");
}

function renderValidation(){
  const { issues } = analyze();
  const groups = { error: [], warn: [], info: [] };
  for (const i of issues) groups[i.level].push(i);

  const head = { error: "✕ 错误", warn: "! 警告", info: "i 提示" };
  const desc = {
    error: "固件里会直接失败或行为不符预期",
    warn:  "能跑起来，但多半不是你想要的",
    info:  "供参考，不一定有问题"
  };

  document.getElementById("v-total").textContent = String(issues.length);

  let html = "";
  if (issues.length === 0){
    html = `<div class="vnone">没有发现问题。<br><span style="color:var(--fg-mute)">发布与订阅的关系自洽。</span></div>`;
  } else {
    for (const lv of ["error", "warn", "info"]){
      if (groups[lv].length === 0) continue;
      html += `<div class="vgroup ${lv}">
        <div class="head"><span>${head[lv]}</span><span class="count">${groups[lv].length}</span>
          <span style="color:var(--fg-mute); font-size:10px; font-weight:400">${desc[lv]}</span></div>`;
      for (const it of groups[lv]){
        html += `<div class="vitem" ${it.nodeId ? `data-goto-node="${esc(it.nodeId)}"` : (it.busId ? `data-goto-bus="${esc(it.busId)}"` : "")}>
          <span class="ico">${lv === "error" ? "✕" : lv === "warn" ? "!" : "i"}</span>
          <span class="body"><span>${it.msg}</span><span class="where">${esc(it.where)}</span></span>
        </div>`;
      }
      html += `</div>`;
    }
  }
  document.getElementById("validation").innerHTML = html;
}

function renderStatus(){
  const { issues, } = analyze();
  const nodes = doc.buses.reduce((a, b) => a + b.nodes.length, 0);
  const pubs  = doc.buses.reduce((a, b) => a + b.nodes.reduce((x, n) => x + n.publishes.length, 0), 0);
  const subs  = doc.buses.reduce((a, b) => a + b.nodes.reduce((x, n) => x + n.subscribes.length, 0), 0);
  const nErr  = issues.filter(i => i.level === "error").length;
  const nWarn = issues.filter(i => i.level === "warn").length;

  document.getElementById("stat-counts").innerHTML =
    `总线 <b>${doc.buses.length}</b> · 节点 <b>${nodes}</b> · 发布 <b>${pubs}</b> · 订阅 <b>${subs}</b>`;
  document.getElementById("stat-state").innerHTML =
    nErr ? `<span style="color:var(--err)">${nErr} 个错误</span>` :
    nWarn ? `<span style="color:var(--warn)">${nWarn} 个警告</span>` :
    `<span style="color:var(--ok)">校验通过</span>`;
}

function renderAll(){
  renderTable();
  renderGraph();
  renderTree();
  renderValidation();
  renderStatus();
  document.getElementById("doc-title").value = doc.title;
  document.getElementById("doc-comment").value = doc.comment;
}

/* ==========================================================================
 * 8. 编辑操作
 * ========================================================================== */

function gotoNode(nodeId){
  selectedNodeId = nodeId;
  if (currentView !== "table") setView("table");
  renderTree();
  for (const el of document.querySelectorAll(".node-card")) el.classList.remove("active");
  const card = document.getElementById(`node-${CSS.escape(nodeId)}`);
  if (card){
    card.classList.add("active");
    card.scrollIntoView({ block: "center", behavior: "smooth" });
    card.classList.remove("flash"); void card.offsetWidth; card.classList.add("flash");
  }
}
function gotoBus(busId){
  if (currentView !== "table") setView("table");
  const el = document.getElementById(`bus-${CSS.escape(busId)}`);
  if (el) el.scrollIntoView({ block: "start", behavior: "smooth" });
}

/* 事件委托：所有 data-act 按钮 */
document.addEventListener("click", (ev) => {
  const goto = ev.target.closest("[data-goto-node]");
  if (goto && !ev.target.closest("button")){ gotoNode(goto.dataset.gotoNode); return; }
  const gotoB = ev.target.closest("[data-goto-bus]");
  if (gotoB && !ev.target.closest("button")){ gotoBus(gotoB.dataset.gotoBus); return; }

  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  const bid = el.dataset.bus, nid = el.dataset.node, idx = el.dataset.idx;

  if (act === "add-bus" || act === "load-sample"){
    if (act === "load-sample"){ loadSample(); return; }
    const b = newBus(`bus_${doc.buses.length + 1}`);
    doc.buses.push(b); commit(); return;
  }
  if (act === "del-bus"){
    const b = findBus(bid);
    if (b && confirm(`删除总线「${b.name || "(未命名)"}」及其 ${b.nodes.length} 个节点？`)){
      doc.buses = doc.buses.filter(x => x.id !== bid); commit();
    }
    return;
  }
  if (act === "add-node"){
    const b = findBus(bid);
    if (b){
      const n = newNode(`node_${b.nodes.length + 1}`);
      b.nodes.push(n); selectedNodeId = n.id; commit();
      const el2 = document.querySelector(`[data-field="node-name"][data-node="${CSS.escape(n.id)}"]`);
      if (el2){ el2.focus(); el2.select(); }
    }
    return;
  }
  if (act === "del-node"){
    const r = findNode(nid);
    if (r && confirm(`删除节点「${r.node.name || "(未命名)"}」及其全部发布/订阅？`)){
      r.bus.nodes = r.bus.nodes.filter(x => x.id !== nid);
      if (selectedNodeId === nid) selectedNodeId = null;
      commit();
    }
    return;
  }
  if (act === "add-pub"){
    const r = findNode(nid);
    if (r){
      r.node.publishes.push(newPublish()); commit();
      const el2 = document.querySelector(`[data-field="pub-topic"][data-node="${CSS.escape(nid)}"][data-idx="${r.node.publishes.length - 1}"]`);
      if (el2) el2.focus();
    }
    return;
  }
  if (act === "del-pub"){
    const r = findNode(nid);
    if (r){ r.node.publishes.splice(+idx, 1); commit(); }
    return;
  }
  if (act === "add-sub"){
    const r = findNode(nid);
    if (r){
      r.node.subscribes.push(newSubscribe()); commit();
      const el2 = document.querySelector(`[data-field="sub-filter"][data-node="${CSS.escape(nid)}"][data-idx="${r.node.subscribes.length - 1}"]`);
      if (el2) el2.focus();
    }
    return;
  }
  if (act === "del-sub"){
    const r = findNode(nid);
    if (r){ r.node.subscribes.splice(+idx, 1); commit(); }
    return;
  }
  if (act === "reset-layout"){
    const b = findBus(bid);
    if (b){
      for (const n of b.nodes){ n.x = null; n.y = null; }
      /* 线的形状也一起还原 —— 位置都重排了，留着旧偏移只会让线缠成一团。
         颜色是人特地挑的，不属于「位置」，保留。 */
      for (const e of (b.edges || [])){ e.dx = null; e.dy = null; }
      selectedEdge = null; closeEdgePanel();
      commit();
    }
    return;
  }
  if (act === "toggle-code"){
    /* 收起时顺手丢掉缓存：下次展开算作「首次生成」，不会因为期间改过配置
       而把整段代码闪一遍。 */
    if (codeOpen.has(nid)){ codeOpen.delete(nid); codeCache.delete(nid); }
    else codeOpen.add(nid);
    commit();
    return;
  }
  if (act === "toggle-bus-code"){
    if (busCodeOpen.has(bid)){ busCodeOpen.delete(bid); codeCache.delete(bid); }
    else busCodeOpen.add(bid);
    commit();
    return;
  }
  /* 缩放只动视野，不碰文档 —— 所以不走 commit()，不然会把表格视图也重绘一遍。 */
  if (act === "zoom-in")    { setGraphZoom(graphZoom * 1.2); return; }
  if (act === "zoom-out")   { setGraphZoom(graphZoom / 1.2); return; }
  if (act === "zoom-reset") { setGraphZoom(1);               return; }
});

/* ── 改颜色的小面板 ──────────────────────────────────────────────────────
   面板本身不在 <svg> 里，所以它的点击不会经过上面那套委托，单独接。 */
document.getElementById("ep-color").addEventListener("input", (ev) => {
  const p = document.getElementById("edge-panel");
  const info = graphEdges.get(p.dataset.key);
  const bus  = findBus(p.dataset.bus);
  if (!info || !bus) return;
  const color = normColor(ev.target.value);
  setEdgeStyle(bus, info.from, info.to, info.topic, { color });
  /* 只改颜色，不整块重绘：色板正在被拖动，重建 DOM 会把输入框抽掉、打断操作。
     直接改现有元素的描边和它自己的那个箭头，视觉上立刻生效。 */
  for (const el of document.querySelectorAll(`[data-edge-key="${p.dataset.key}"]`)){
    if (el.tagName === "path" && !el.classList.contains("gedge-hit")) el.style.stroke = color;
  }
  const base = document.querySelector(`path.gedge[data-edge-key="${p.dataset.key}"]`);
  const mk = base && base.dataset.marker &&
             base.ownerSVGElement.querySelector(`#${CSS.escape(base.dataset.marker)} path`);
  if (mk) mk.setAttribute("fill", color || "var(--pub)");
  schedulePersist();
});

document.getElementById("ep-reset").addEventListener("click", () => {
  const p = document.getElementById("edge-panel");
  const info = graphEdges.get(p.dataset.key);
  const bus  = findBus(p.dataset.bus);
  if (info && bus){
    setEdgeStyle(bus, info.from, info.to, info.topic, { color: "" });
    schedulePersist();
    renderGraph();
    openEdgePanel(p.dataset.bus, p.dataset.key, p.getBoundingClientRect().left,
                  p.getBoundingClientRect().bottom);
  }
});

document.getElementById("ep-close").addEventListener("click", () => {
  selectedEdge = null; closeEdgePanel(); renderGraph();
});

/* 点面板以外的地方就收起来（点空白处会另走 renderGraph，这里只兜底）。 */
document.addEventListener("mousedown", (ev) => {

  if (p && p.classList.contains("show") && !ev.target.closest("#edge-panel")
      && !ev.target.closest("[data-edge-key]"))

document.addEventListener("keydown", (ev) => {

});

/* 事件委托：所有输入 */
function onFieldInput(ev){
  const el = ev.target;
  const f = el.dataset.field;
  if (!f) return;
  const bid = el.dataset.bus, nid = el.dataset.node, idx = el.dataset.idx;

  if (f === "doc-title"){ doc.title = el.value; schedulePersist(); return; }
  if (f === "doc-comment"){ doc.comment = el.value; schedulePersist(); return; }

  const bus = bid ? findBus(bid) : null;
  if (f === "bus-name" && bus){ bus.name = el.value; }
  else if (f === "bus-comment" && bus){ bus.comment = el.value; }
  else if (f === "bus-nodeevents" && bus){ bus.nodeEvents = el.checked; }

  const r = nid ? findNode(nid) : null;
  if (r){
    const node = r.node;
    if (f === "node-name"){ node.name = el.value; }
    else if (f === "node-comment"){ node.comment = el.value; }
    else if (f === "pub-topic" && node.publishes[+idx]){ node.publishes[+idx].topic = el.value; }
    else if (f === "pub-payload" && node.publishes[+idx]){ node.publishes[+idx].payload = el.value; }
    else if (f === "pub-retain" && node.publishes[+idx]){ node.publishes[+idx].retain = el.checked; }
    else if (f === "pub-to" && node.publishes[+idx]){ node.publishes[+idx].to = el.value.trim(); }
    else if (f === "pub-comment" && node.publishes[+idx]){ node.publishes[+idx].comment = el.value; }
    else if (f === "sub-filter" && node.subscribes[+idx]){ node.subscribes[+idx].filter = el.value; }
    else if (f === "sub-source" && node.subscribes[+idx]){ node.subscribes[+idx].source = el.value.trim(); }
    else if (f === "sub-nolocal" && node.subscribes[+idx]){ node.subscribes[+idx].nolocal = el.checked; }
    else if (f === "sub-skipretained" && node.subscribes[+idx]){ node.subscribes[+idx].skipRetained = el.checked; }
    else if (f === "sub-comment" && node.subscribes[+idx]){ node.subscribes[+idx].comment = el.value; }
  }

  /* 代码块也是「派生显示」：输入时不重建卡片，所以要单独把它刷一遍。
     新增/改动的行闪一下背景，其余不变。 */
  if (r && codeOpen.has(r.node.id))
    renderCodeBlock(r.node.id, nodeCodeLines(r.bus, r.node), true);
  if (bus && busCodeOpen.has(bus.id))
    renderCodeBlock(bus.id, busCodeLines(bus), true);

  refreshDerived();
  scheduleGraphRefresh();
  schedulePersist();
}
document.addEventListener("input", onFieldInput);
document.addEventListener("change", onFieldInput);

/* ==========================================================================
 * 9. 视图切换 / 侧栏收起
 * ========================================================================== */

function setView(v){
  currentView = v;
  document.getElementById("view-table").classList.toggle("hidden", v !== "table");
  document.getElementById("view-graph").classList.toggle("hidden", v !== "graph");
  document.getElementById("tab-table").classList.toggle("active", v === "table");
  document.getElementById("tab-graph").classList.toggle("active", v === "graph");
  if (v === "graph") renderGraph();
}

/* ==========================================================================
 * 10. 持久化：localStorage 自动保存 + 文件导入导出
 * ========================================================================== */

let persistTimer = null, graphTimer = null;

function schedulePersist(){
  clearTimeout(persistTimer);
  persistTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORAGE_KEY, docToXml());
      document.getElementById("stat-state").dataset.saved = "1";
    } catch (e){
      toast("自动保存到 localStorage 失败：" + e.message, true);
    }
  }, 500);
}
function scheduleGraphRefresh(){
  if (currentView !== "graph") return;
  clearTimeout(graphTimer);
  graphTimer = setTimeout(renderGraph, 250);
}

function commit(){
  renderAll();
  schedulePersist();
}

function toast(msg, isErr){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.toggle("err", !!isErr);
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 2400);
}

function setFileLabel(name){
  document.getElementById("stat-file").textContent = name ? `文件：${name}` : "尚未保存到文件";
}

async function saveToFile(forcePicker){
  const xml = docToXml();

  /* 优先用 File System Access API：能真正「保存到本地磁盘」，而不是下载一份副本。
     file:// 下部分浏览器不提供该 API，退回下载。 */
  const canPicker = typeof window.showSaveFilePicker === "function";

  if (!forcePicker && fileHandle){
    try {
      const w = await fileHandle.createWritable();
      await w.write(xml); await w.close();
      setFileLabel(fileHandle.name); toast(`已保存到 ${fileHandle.name}`);
      return;
    } catch (e){ toast("写入文件失败：" + e.message, true); return; }
  }

  if (canPicker){
    try {
      fileHandle = await window.showSaveFilePicker({
        suggestedName: suggestFileName(),
        types: [{ description: "消息总线设计 (XML)", accept: { "application/xml": [".xml"] } }]
      });
      const w = await fileHandle.createWritable();
      await w.write(xml); await w.close();
      setFileLabel(fileHandle.name); toast(`已保存到 ${fileHandle.name}`);
      return;
    } catch (e){
      if (e.name === "AbortError") return;
      /* 其它错误（例如 file:// 下被拒绝）就退回下载 */
    }
  }

  downloadXml(xml);
}

function suggestFileName(){
  const base = (doc.title || doc.buses[0] && doc.buses[0].name || "message-bus-design")
    .replace(/[\\/:*?"<>|]/g, "_").trim() || "message-bus-design";
  return base.endsWith(".xml") ? base : base + ".xml";
}

function downloadXml(xml){
  const blob = new Blob([xml], { type: "application/xml;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = suggestFileName();
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  toast("已导出 " + a.download);
}

function importText(text, sourceName){
  let parsed;
  try { parsed = xmlToDoc(text); }
  catch (e){ toast("导入失败：" + e.message, true); return; }
  doc = parsed;
  selectedNodeId = null;
  fileHandle = null;
  setFileLabel(sourceName || null);
  renderAll();
  schedulePersist();
  toast(`已导入 ${doc.buses.length} 条总线 / ${doc.buses.reduce((a, b) => a + b.nodes.length, 0)} 个节点`);
}

/* ==========================================================================
 * 11. 示例文档（对应 examples/03_lvgl_motor_sensor.c）
 * ========================================================================== */

function sampleDoc(){
  const d = emptyDoc();
  d.title = "LVGL / 电机 / 传感器解耦（对应 examples/03）";
  d.comment = "三个节点互为陌生人：界面只认主题名，传感器只管上报，电机只认 motor/cmd。\n"
            + "换平台时把 motor 的回调换成 HAL、把 sensor 的定时发布换成 ADC 即可，其余不动。";

  const bus = newBus("app");
  bus.nodeEvents = true;
  bus.comment = "主应用总线。PC 模拟器与 MCU 固件跑的是同一份代码，只有 OS 抽象层不同。";

  const sensor = newNode("sensor");
  sensor.comment = "ADC 采样任务。只往 sensor/... 发数据，不关心有没有界面在听。\n注意：回调在发布者线程里同步执行，所以 UI 相关处理要留给 LVGL 线程。";
  sensor.publishes.push(Object.assign(newPublish(), {
    topic: "sensor/temp/value", payload: "23.4", retain: true,
    comment: "用 retained：界面比传感器后启动时，subscription 返回前就能立刻拿到当前值，不用等下一次采样。"
  }));
  sensor.publishes.push(Object.assign(newPublish(), {
    topic: "sensor/humi/value", payload: "55.0", retain: true, comment: "同上。"
  }));

  const motor = newNode("motor");
  motor.comment = "电机控制节点。真实工程里这里换成 PWM / GPIO / 编码器驱动。";
  motor.publishes.push(Object.assign(newPublish(), {
    topic: "motor/speed/status", payload: "0 rpm", retain: true,
    comment: "状态类消息用 retained，否则后启动的界面会一直显示 (no data)。"
  }));
  motor.subscribes.push(Object.assign(newSubscribe(), {
    filter: "motor/cmd",
    comment: "命令类消息**不要**用 retained：否则后加入的订阅者会重放一条早就过期的命令。\n这就是 examples/03 里 ui_button_set_speed() 传 flags = 0 的原因。"
  }));

  const ui = newNode("lvgl_ui");
  ui.comment = "LVGL 界面节点。只订阅，不发布任何硬件相关的东西。\n重要：不要在回调里直接调用 lv_label_set_text()——回调跑在发布者线程，而 LVGL 不是线程安全的。\n推荐做法：回调只写变量/环形缓冲，由 LVGL 线程定时刷新；或 lv_async_call() 抛回 UI 线程。";
  ui.publishes.push(Object.assign(newPublish(), {
    topic: "motor/cmd", payload: "speed=1200",
    comment: "按钮事件：发命令给电机节点，而不是直接调用电机驱动。等价写法 mb_node_publish_to(ui, \"motor\", \"cmd\", ...)。"
  }));
  ui.subscribes.push(Object.assign(newSubscribe(), {
    filter: "sensor/+/value",
    comment: "'+' 恰好匹配一层：sensor/temp/value 和 sensor/humi/value 都会命中；\n但 sensor/room1/temp/value 不会（那是三层）。"
  }));
  ui.subscribes.push(Object.assign(newSubscribe(), {
    filter: "motor/+/status", comment: "同上，电机状态。"
  }));

  bus.nodes.push(sensor, motor, ui);
  d.buses.push(bus);
  return d;
}

function loadSample(){
  if (doc.buses.length && !confirm("载入示例会覆盖当前内容（已自动保存到本地的副本不受影响）。继续？")) return;
  doc = sampleDoc();
  selectedNodeId = null; fileHandle = null; setFileLabel(null);
  renderAll(); schedulePersist();
  toast("已载入示例（examples/03 的对应设计）");
}

/* ==========================================================================
 * 12. 启动
 * ========================================================================== */

document.getElementById("tab-table").onclick = () => setView("table");
document.getElementById("tab-graph").onclick = () => setView("graph");
document.getElementById("btn-new").onclick = () => {
  if (doc.buses.length && !confirm("新建会清空当前内容（localStorage 里的自动保存会被覆盖）。继续？")) return;
  doc = emptyDoc(); selectedNodeId = null; fileHandle = null; setFileLabel(null);
  renderAll(); schedulePersist(); toast("已新建空白设计");
};
document.getElementById("btn-sample").onclick = loadSample;
document.getElementById("btn-add-bus").onclick = () => {
  doc.buses.push(newBus(`bus_${doc.buses.length + 1}`)); commit();
};
document.getElementById("btn-save").onclick = () => saveToFile(false);
document.getElementById("btn-saveas").onclick = () => saveToFile(true);
document.getElementById("btn-export").onclick = () => downloadXml(docToXml());
document.getElementById("btn-import").onclick = () => document.getElementById("file-input").click();
document.getElementById("file-input").onchange = (ev) => {
  const f = ev.target.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => importText(String(rd.result), f.name);
  rd.onerror = () => toast("读取文件失败", true);
  rd.readAsText(f, "utf-8");
  ev.target.value = "";
};
document.getElementById("btn-clear-local").onclick = () => {
  if (!confirm("清除浏览器里自动保存的副本？当前编辑内容不受影响。")) return;
  localStorage.removeItem(STORAGE_KEY); toast("已清除本地自动保存");
};
document.getElementById("btn-sidebar").onclick = () => {
  const l = document.getElementById("layout");
  l.classList.toggle("no-sidebar");
  document.getElementById("sidebar").classList.toggle("hidden", l.classList.contains("no-sidebar"));
};
document.getElementById("btn-inspector").onclick = () => {
  const l = document.getElementById("layout");
  l.classList.toggle("no-inspector");
  document.getElementById("inspector").classList.toggle("hidden", l.classList.contains("no-inspector"));
};
document.addEventListener("keydown", (ev) => {
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "s"){ ev.preventDefault(); saveToFile(false); }
});

(function boot(){
  /* 版本号：与 mb_version.h 保持一致，方便一眼看出网页对应哪版库 */
  document.getElementById("libver").textContent = "message_bus 1.0.0";

  /* 开页先自检：确认网页里的主题规则没被改坏、仍与固件一致。
     命令行版本是 tools/web-selftest.js（cscript），两边跑的是同一张用例表。 */
  const stFails = window.mbSelfTest();
  if (stFails.length)
    toast("内部自检未通过（" + stFails.length + " 项）：主题规则可能已与固件不一致，详见控制台", true);

  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved){
    try { doc = xmlToDoc(saved); document.getElementById("stat-file").textContent = "来自浏览器本地自动保存"; }
    catch (e){
      console.warn("localStorage 里的内容无法解析，已改用示例：", e);
      doc = sampleDoc();
    }
  } else {
    doc = sampleDoc();
  }

  renderAll();
  setView("table");

  /* 窗口尺寸一变，关系图的「至少铺满可视区」就得重算，否则最大化窗口后
     画布还是按旧高度画的。拖拽过程中不重绘 —— 那会把正被拖的元素从脚下抽走。 */
  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (!dragState && currentView === "graph") renderGraph();
    }, 150);
  });

  window.addEventListener("beforeunload", () => {
    try { localStorage.setItem(STORAGE_KEY, docToXml()); } catch (e){ /* 忽略 */ }
  });
})();
</script>
