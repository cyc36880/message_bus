name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

# 同一分支的新 push 取消仍在跑的旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  # ---------------------------------------------------------------------------
  # 三平台：编译 + 单元测试 + 跑示例
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-latest
            shell: bash
            generator: -G Ninja
          - name: Linux (Clang)
            os: ubuntu-latest
            shell: bash
            generator: -G Ninja
            cc: clang
            cxx: clang++
          - name: macOS (AppleClang)
            os: macos-latest
            shell: bash
            generator: -G Ninja
          - name: Windows (MinGW / MSYS2 UCRT64)
            os: windows-latest
            shell: msys2 {0}
            generator: -G Ninja

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v4

      # ---- Windows：准备 MSYS2 UCRT64 工具链 ----
      - name: 安装 MSYS2 工具链
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-make

      # ---- 其它平台：准备 cmake / ninja ----
      - name: 安装构建工具
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y ninja-build
          else
            brew install ninja || true
          fi

      - name: 选择编译器
        if: matrix.cc != ''
        run: echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"; echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      - name: 配置
        run: cmake -S . -B build ${{ matrix.generator }} -DCMAKE_BUILD_TYPE=Debug -DMB_WARNINGS_AS_ERRORS=ON

      - name: 编译
        run: cmake --build build --parallel

      - name: 单元测试（CTest）
        run: ctest --test-dir build --output-on-failure

      - name: 运行示例
        run: |
          ./build/bin/example_01_basic_pubsub
          ./build/bin/example_02_wildcards_filter
          ./build/bin/example_03_lvgl_motor_sensor
          ./build/bin/example_04_node_events
        shell: bash

  # ---------------------------------------------------------------------------
  # Sanitizer：ASan + UBSan 抓内存与未定义行为问题
  # （MSYS2 的 MinGW 不带 libsanitizer，所以只在 Linux 上跑）
  # ---------------------------------------------------------------------------
  sanitizers:
    name: Linux (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建工具
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: 配置
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMB_BUILD_EXAMPLES=OFF \
            -DMB_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: 编译
        run: cmake --build build --parallel

      - name: 单元测试
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # ThreadSanitizer：抓数据竞争（data race）
  #
  # 为什么必须单独一个 job：ASan/UBSan **不检测数据竞争** —— 上面的
  # sanitizers job 能抓到异步队列的越界写、释放后使用、内存泄漏，但对
  # 「两个线程同时读写同一个字段」完全无感。检测竞争的只有 TSan，
  # 而 TSan 与 ASan 不能同时启用在同一个二进制里，所以只能各跑一遍。
  #
  # 覆盖面：整个 mb_tests（test_main.c 的 main(void) 不接受参数，无法只选
  # 套件）。真正有意义的是 threads 与 async 两个套件 —— 生产者线程、
  # 计数信号量、以及覆盖策略下的消息回收路径都在那里。
  #
  # 注意 TSan 只支持 x86_64 Linux/macOS，MinGW 目标直接拒绝
  # （clang 会报 unsupported option '-fsanitize=thread'），所以这里只跑 Linux。
  # ---------------------------------------------------------------------------
  tsan:
    name: Linux (ThreadSanitizer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建工具
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: 配置
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMB_BUILD_EXAMPLES=OFF \
            -DMB_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: 编译
        run: cmake --build build --parallel

      - name: 单元测试
        env:
          # second_deadlock_stack=1：报告死锁时把涉及的**两方**调用栈都打出来，
          # 否则只能看到阻塞住的那一个线程，定位要靠猜。
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # 配置矩阵：库支持若干编译期配置，只验默认那一种等于没验 ——
  # 同一份代码在不同宏下走的是不同的分支，测试里也有对应的 #if 守卫。
  #
  # 注意 CMAKE_C_FLAGS 是给**所有目标**的：库与测试必须看到同一组宏，
  # 否则测试里的 #if 守卫和库的真实行为会对不上，测出来的结论是假的。
  # ---------------------------------------------------------------------------
  configs:
    name: 配置矩阵（${{ matrix.name }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 覆盖最旧消息（编译期默认开启）
            defs: -DMB_CONFIG_ASYNC_OVERWRITE_OLDEST=1
          - name: 关闭异步功能
            defs: -DMB_CONFIG_ASYNC_MAX_TOPICS=0
          - name: 队列深度 1（最紧的边界）
            defs: -DMB_CONFIG_ASYNC_QUEUE_DEPTH=1
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建工具
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: 配置
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DMB_BUILD_EXAMPLES=OFF \
            -DMB_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_C_FLAGS="${{ matrix.defs }}"

      - name: 编译
        run: cmake --build build --parallel

      - name: 单元测试
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # 交叉编译冒烟测试：确认 freertos / none 两个 port 至少能编译
  # ---------------------------------------------------------------------------
  ports:
    name: 交叉 port 编译（freertos / none）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建工具
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # FreeRTOS 头文件桩在仓库里（tests/freertos_stub/），不再由本文件现写。
      # 以前是内联 heredoc，后果是改 port 加了新的 FreeRTOS API 而桩没跟上时，
      # 只有 CI 会挂、本地看不出来 —— 异步投递的计数信号量就是这么漏的。
      # 现在它和 port 一起进版本控制，缺失会出现在同一个 diff 里。
      - name: 检查 FreeRTOS 头文件桩
        run: ls tests/freertos_stub

      - name: 配置（FreeRTOS port）
        run: |
          cmake -S . -B build-freertos -G Ninja \
            -DMB_OS=freertos \
            -DMB_FREERTOS_INCLUDE_DIR="$GITHUB_WORKSPACE/tests/freertos_stub" \
            -DMB_BUILD_TESTS=OFF -DMB_BUILD_EXAMPLES=OFF \
            -DMB_WARNINGS_AS_ERRORS=ON

      - name: 编译（FreeRTOS port）
        run: cmake --build build-freertos --parallel

      - name: 配置 + 编译（裸机 port）
        run: |
          cmake -S . -B build-none -G Ninja \
            -DMB_OS=none \
            -DMB_BUILD_TESTS=OFF -DMB_BUILD_EXAMPLES=OFF \
            -DMB_WARNINGS_AS_ERRORS=ON
          cmake --build build-none --parallel

  # ---------------------------------------------------------------------------
  # 安装 / find_package 冒烟测试：确认导出配置可用
  # ---------------------------------------------------------------------------
  install:
    name: 安装与 find_package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建工具
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: 构建并安装到临时前缀
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DMB_BUILD_TESTS=OFF -DMB_BUILD_EXAMPLES=OFF
          cmake --build build --parallel
          cmake --install build --prefix "$PWD/_install"

      - name: 用 find_package 消费安装好的库
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(consumer C)
          find_package(message_bus 1.0 REQUIRED)
          add_executable(consumer main.c)
          target_link_libraries(consumer PRIVATE message_bus::message_bus)
          EOF
          cat > main.c <<'EOF'
          #include <message_bus/message_bus.h>
          #include <stdio.h>
          int main(void)
          {
              mb_bus_t *bus = NULL;
              if (mb_bus_create("consumer", &bus) != MB_OK) return 1;
              printf("bus '%s' ok, version %s\n", mb_bus_name(bus), MB_VERSION_STRING);
              mb_bus_destroy(bus);
              return 0;
          }
          EOF
          cmake -S . -B build -G Ninja -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/_install"
          cmake --build build --parallel
          ./build/consumer
